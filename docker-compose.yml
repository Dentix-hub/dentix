# NOTE ON DATABASE:
# This project uses an external/managed Postgres database (e.g., Supabase/RDS).
# Do not run a local Postgres container in production; instead, configure the 
# DATABASE_URL and DB_SSL_MODE environment variables in the .env file.
# Refer to `.env.example` for details and instructions.

services:
  backend:
    image: ${DENTIX_IMAGE:-dentix-app:latest}
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 512M
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - DB_SSL_MODE=${DB_SSL_MODE:-verify-full}
      - DB_SSL_CA_CERT=${DB_SSL_CA_CERT:-/usr/local/share/ca-certificates/supabase-root-2021-ca.crt}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - REDIS_URL=redis://redis:6379/0  # Points to internal redis service
      - SECRET_KEY=${SECRET_KEY}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - ENVIRONMENT=production
      - ENABLE_IN_PROCESS_WORKERS=false
      - LOG_LEVEL=INFO
      - FRONTEND_URL=${FRONTEND_URL}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - BACKEND_PUBLIC_URL=${BACKEND_PUBLIC_URL}
      - PAYMENT_WEBHOOK_SECRET=${PAYMENT_WEBHOOK_SECRET}
    ports:
      # The public entry point is Caddy (80/443); keep Uvicorn private to the Droplet.
      - "127.0.0.1:7860:7860"
    volumes:
      - uploads_data:/app/backend/uploads
      - rag_data:/app/rag_storage
      - chroma_model_cache:/home/dentix/.cache/chroma
    depends_on:
      - redis
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"


  worker:
    image: ${DENTIX_IMAGE:-dentix-app:latest}
    command: ["python", "-m", "backend.workers.prefect_worker"]
    restart: always
    # The image healthcheck probes the HTTP API, which workers do not serve.
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379/0
      - GROQ_API_KEY=${GROQ_API_KEY}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - SECRET_KEY=${SECRET_KEY}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - DB_SSL_MODE=${DB_SSL_MODE:-verify-full}
      - DB_SSL_CA_CERT=${DB_SSL_CA_CERT:-/usr/local/share/ca-certificates/supabase-root-2021-ca.crt}
      - ENVIRONMENT=production
    volumes:
      - uploads_data:/app/backend/uploads
    depends_on:
      - redis

  domain-worker:
    image: ${DENTIX_IMAGE:-dentix-app:latest}
    command: ["python", "-m", "backend.workers.run", "--workers", "all"]
    restart: always
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - DB_SSL_MODE=${DB_SSL_MODE:-verify-full}
      - DB_SSL_CA_CERT=${DB_SSL_CA_CERT:-/usr/local/share/ca-certificates/supabase-root-2021-ca.crt}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - DENTIX_WORKERS=all
      - EVENT_WORKER_POLL_INTERVAL_SECONDS=${EVENT_WORKER_POLL_INTERVAL_SECONDS:-5}
      - SUBSCRIPTION_CHECK_INTERVAL_HOURS=${SUBSCRIPTION_CHECK_INTERVAL_HOURS:-12}
    volumes:
      - uploads_data:/app/backend/uploads
    depends_on:
      - backend
      - redis

  redis:
    image: redis:7-alpine
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    command: redis-server --save 60 1 --loglevel warning # Persistence every 60s if 1 change
    volumes:
      - redis_data:/data
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  caddy:
    image: caddy:2-alpine
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=dentixs.app
      - ACME_EMAIL=eslam@dentixs.app
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  uploads_data:
  rag_data:
  chroma_model_cache:
  redis_data:
  caddy_data:
  caddy_config:
