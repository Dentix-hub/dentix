<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إدارة المصاريف الشهرية</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Arial, sans-serif; }
  body { background: linear-gradient(135deg, #f5f7fa 0%, #e4ecf3 100%); min-height: 100vh; padding: 20px; color: #1f2937; }
  .container { max-width: 1100px; margin: 0 auto; }
  
  /* Header */
  .header { background: linear-gradient(135deg, #4f46e5, #7c3aed); color: white; padding: 30px; border-radius: 16px; margin-bottom: 24px; box-shadow: 0 10px 25px rgba(79,70,229,0.2); }
  .header h1 { font-size: 28px; margin-bottom: 8px; }
  .header .date-range { opacity: 0.9; font-size: 14px; }
  
  /* Grid */
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
  
  /* Cards */
  .card { background: white; border-radius: 14px; padding: 24px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid #e5e7eb; }
  .card h3 { font-size: 18px; margin-bottom: 16px; color: #374151; display: flex; align-items: center; gap: 8px; }
  
  /* Stats row */
  .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; margin-bottom: 20px; }
  .stat-box { background: white; padding: 16px; border-radius: 12px; text-align: center; border: 1px solid #e5e7eb; }
  .stat-box .value { font-size: 22px; font-weight: bold; color: #4f46e5; margin: 4px 0; }
  .stat-box .label { font-size: 12px; color: #6b7280; }
  
  /* Form */
  .form-row { display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 10px; margin-bottom: 12px; align-items: end; }
  @media (max-width: 600px) { .form-row { grid-template-columns: 1fr; } }
  input, select, button { padding: 10px 14px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; outline: none; }
  input:focus, select:focus { border-color: #4f46e5; box-shadow: 0 0 0 3px rgba(79,70,229,0.1); }
  button { background: #4f46e5; color: white; border: none; cursor: pointer; font-weight: 600; transition: all 0.2s; }
  button:hover { background: #4338ca; transform: translateY(-1px); }
  button.danger { background: #ef4444; padding: 6px 10px; font-size: 12px; }
  button.danger:hover { background: #dc2626; }
  
  /* Table */
  .table-wrap { max-height: 420px; overflow-y: auto; border-radius: 10px; border: 1px solid #e5e7eb; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { background: #f9fafb; position: sticky; top: 0; padding: 10px 12px; text-align: right; border-bottom: 2px solid #e5e7eb; color: #4b5563; z-index: 1; }
  td { padding: 10px 12px; border-bottom: 1px solid #f3f4f6; }
  tr:hover td { background: #f9fafb; }
  .badge { display: inline-block; padding: 3px 8px; border-radius: 20px; font-size: 11px; font-weight: 600; }
  .badge-أكل { background: #fee2e2; color: #b91c1c; }
  .badge-نقل { background: #fef3c7; color: #92400e; }
  .badge-تسوق { background: #e0e7ff; color: #3730a3; }
  .badge-صحة { background: #d1fae5; color: #065f46; }
  .badge-ترفيه { background: #fce7f3; color: #9d174d; }
  .badge-فواتير { background: #e0f2fe; color: #075985; }
  .badge-أخرى { background: #f3f4f6; color: #374151; }
  
  .empty { text-align: center; padding: 40px; color: #9ca3af; }
  .empty .icon { font-size: 40px; margin-bottom: 10px; }
  
  /* Chart */
  .chart-container { position: relative; height: 260px; }
  
  /* Budget */
  .budget-section { margin-top: 16px; padding-top: 16px; border-top: 1px dashed #e5e7eb; }
  .progress-bar { height: 10px; background: #e5e7eb; border-radius: 5px; overflow: hidden; margin-top: 8px; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, #4f46e5, #7c3aed); border-radius: 5px; transition: width 0.4s ease; }
  .progress-fill.over { background: linear-gradient(90deg, #ef4444, #f59e0b); }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>📊 إدارة المصاريف الشهرية</h1>
    <div class="date-range" id="currentMonth"></div>
  </div>
  
  <!-- Stats -->
  <div class="stats-row">
    <div class="stat-box">
      <div class="label">إجمالي الشهر</div>
      <div class="value" id="totalMonth">0</div>
      <div class="label">ج.م</div>
    </div>
    <div class="stat-box">
      <div class="label">الميزانية</div>
      <div class="value" id="budgetDisplay">0</div>
      <div class="label">ج.م</div>
    </div>
    <div class="stat-box">
      <div class="label">المتبقي</div>
      <div class="value" id="remainingDisplay">0</div>
      <div class="label">ج.م</div>
    </div>
    <div class="stat-box">
      <div class="label">حالة الميزانية</div>
      <div class="value" id="budgetStatus" style="font-size:16px">—</div>
      <div class="label" id="budgetPercent">0%</div>
    </div>
  </div>

  <div class="grid">
    <!-- Input Form -->
    <div class="card">
      <h3>➕ إضافة مصروف جديد</h3>
      <form id="expenseForm" class="form-row">
        <input type="date" id="dateInput" required title="التاريخ">
        <input type="number" id="amountInput" placeholder="المبلغ (ج.م)" min="0.01" step="0.01" required>
        <select id="categoryInput" required>
          <option value="">التصنيف</option>
          <option>أكل</option><option>نقل</option><option>تسوق</option>
          <option>صحة</option><option>ترفيه</option><option>فواتير</option><option>أخرى</option>
        </select>
        <button type="submit">إضافة</button>
      </form>
      <input type="text" id="noteInput" placeholder="ملاحظة (اختياري) — أو استخدم 🎤 للتسجيل الصوتي" style="width:100%;margin-top:10px;padding:9px;border:1px solid #d1d5db;border-radius:8px;">
      <div style="display:flex;gap:8px;margin-top:8px;align-items:center;flex-wrap:wrap;">
        <button type="button" id="startVoiceBtn" style="background:#059669;font-size:16px;padding:10px 16px;border-radius:8px;">🎤 ابدأ التسجيل</button>
        <button type="button" id="stopVoiceBtn" style="background:#dc2626;font-size:16px;padding:10px 16px;border-radius:8px;display:none;">⏹ إيقاف</button>
        <span id="voiceStatus" style="font-size:13px;color:#6b7280;">جاهز للتسجيل</span>
      </div>
      
      <div class="budget-section">
        <h3 style="font-size:15px;margin-bottom:8px;">💰 تعيين ميزانية الشهر</h3>
        <div class="form-row">
          <input type="number" id="budgetInput" placeholder="الميزانية (ج.م)" min="0" step="100">
          <button id="setBudgetBtn" style="background:#059669;">تحديد الميزانية</button>
        </div>
        <div class="progress-bar"><div class="progress-fill" id="budgetProgress"></div></div>
      </div>
    </div>

    <!-- Chart -->
    <div class="card">
      <h3>📈 التحليل حسب التصنيف</h3>
      <div class="chart-container"><canvas id="categoryChart"></canvas></div>
    </div>
  </div>

  <!-- Table -->
  <div class="card" style="margin-top:20px;">
    <h3>📋 قائمة المصاريف</h3>
    <div class="table-wrap">
      <table>
        <thead><tr><th>التاريخ</th><th>المبلغ</th><th>التصنيف</th><th>ملاحظة</th><th>حذف</th></tr></thead>
        <tbody id="expenseTable"></tbody>
      </table>
    </div>
    <div class="empty" id="emptyState"><div class="icon">📭</div>لا توجد مصاريف مسجلة هذا الشهر</div>
  </div>
</div>

<script>
  // State
  let expenses = JSON.parse(localStorage.getItem('expenses') || '[]');
  let monthlyBudget = parseFloat(localStorage.getItem('monthlyBudget') || '0');

  // Utilities
  const fmt = n => new Intl.NumberFormat('ar-EG', {minimumFractionDigits:2, maximumFractionDigits:2}).format(n);
  const today = () => new Date().toISOString().split('T')[0];
  const currentMonthKey = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; };

  document.getElementById('dateInput').value = today();
  document.getElementById('budgetInput').value = monthlyBudget || '';

  // Render
  function render() {
    const mKey = currentMonthKey();
    const monthExpenses = expenses.filter(e => e.date.startsWith(mKey));
    const total = monthExpenses.reduce((s, e) => s + e.amount, 0);
    
    document.getElementById('totalMonth').textContent = fmt(total);
    document.getElementById('budgetDisplay').textContent = monthlyBudget ? fmt(monthlyBudget) : '0';
    
    const remaining = monthlyBudget - total;
    document.getElementById('remainingDisplay').textContent = monthlyBudget ? fmt(remaining) : '—';
    document.getElementById('remainingDisplay').style.color = remaining < 0 ? '#ef4444' : '#059669';
    
    const pct = monthlyBudget ? Math.min(100, Math.round((total/monthlyBudget)*100)) : 0;
    document.getElementById('budgetPercent').textContent = pct + '%';
    document.getElementById('budgetStatus').textContent = pct >= 100 ? '⚠️ تجاوزت الميزانية' : pct > 80 ? '⚠️ قريب' : '✅ ضمن الميزانية';
    document.getElementById('budgetStatus').style.color = pct >= 100 ? '#ef4444' : pct > 80 ? '#f59e0b' : '#059669';
    
    const bar = document.getElementById('budgetProgress');
    bar.style.width = pct + '%';
    bar.classList.toggle('over', pct >= 100);

    // Table
    const tbody = document.getElementById('expenseTable');
    const sorted = [...monthExpenses].sort((a,b) => new Date(b.date) - new Date(a.date));
    tbody.innerHTML = sorted.map(e => `
      <tr>
        <td>${e.date}</td>
        <td><strong>${fmt(e.amount)}</strong></td>
        <td><span class="badge badge-${e.category}">${e.category}</span></td>
        <td>${e.note || '—'}</td>
        <td><button class="danger" onclick="deleteExpense('${e.id}')">🗑</button></td>
      </tr>
    `).join('');
    document.getElementById('emptyState').style.display = monthExpenses.length === 0 ? 'block' : 'none';

    // Chart
    updateChart(monthExpenses);
  }

  // Chart
  let chartInstance = null;
  function updateChart(monthExpenses) {
    const cats = ['أكل','نقل','تسوق','صحة','ترفيه','فواتير','أخرى'];
    const colors = ['#ef4444','#f59e0b','#6366f1','#10b981','#ec4899','#0ea5e9','#6b7280'];
    const data = cats.map(c => monthExpenses.filter(e => e.category === c).reduce((s,e)=>s+e.amount,0));
    
    if (chartInstance) chartInstance.destroy();
    const ctx = document.getElementById('categoryChart').getContext('2d');
    chartInstance = new Chart(ctx, {
      type: 'doughnut',
      data: { labels: cats, datasets: [{ data, backgroundColor: colors, borderWidth: 2, borderColor: '#fff' }] },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { position: 'bottom', labels: { font: { size: 12 }, padding: 12 } } }
      }
    });
  }

  // Add
  document.getElementById('expenseForm').addEventListener('submit', e => {
    e.preventDefault();
    const expense = {
      id: Date.now() + Math.random().toString(36).slice(2),
      date: document.getElementById('dateInput').value,
      amount: parseFloat(document.getElementById('amountInput').value),
      category: document.getElementById('categoryInput').value,
      note: document.getElementById('noteInput').value.trim()
    };
    expenses.push(expense);
    localStorage.setItem('expenses', JSON.stringify(expenses));
    e.target.reset();
    document.getElementById('dateInput').value = today();
    render();
  });

  // Delete
  function deleteExpense(id) {
    expenses = expenses.filter(e => e.id != id);
    localStorage.setItem('expenses', JSON.stringify(expenses));
    render();
  }

  // Budget
  document.getElementById('setBudgetBtn').addEventListener('click', () => {
    const val = parseFloat(document.getElementById('budgetInput').value);
    if (isNaN(val) || val <= 0) return alert('أدخل مبلغ صحيح للميزانية');
    monthlyBudget = val;
    localStorage.setItem('monthlyBudget', val);
    render();
  });

  // Init
  document.getElementById('currentMonth').textContent = new Date().toLocaleDateString('ar-EG', {year:'numeric',month:'long'});
  render();
  setInterval(() => {
    document.getElementById('currentMonth').textContent = new Date().toLocaleDateString('ar-EG', {year:'numeric',month:'long'});
  }, 60000);

  // ---------------------------------------------------------------
  // 🎤 Voice Input — Web Speech API (Free, no API keys required)
  // ---------------------------------------------------------------
  (function initVoice(){
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const statusEl = document.getElementById('voiceStatus');
    const startBtn = document.getElementById('startVoiceBtn');
    const stopBtn = document.getElementById('stopVoiceBtn');

    if (!SpeechRecognition) {
      statusEl.textContent = '⚠️ متصفحك مش بيدعم التعرف على الصوت. استخدم Chrome أو Edge.';
      startBtn.disabled = true;
      startBtn.style.opacity = 0.6;
      return;
    }

    const recognition = new SpeechRecognition();
    recognition.lang = 'ar-EG';              // Arabic (Egypt)
    recognition.interimResults = false;      // Final transcripts only
    recognition.maxAlternatives = 3;         // Get alternate guesses
    recognition.continuous = false;

    recognition.onstart = () => {
      statusEl.textContent = '🎙 جاري الاستماع... تكلم بالعربي';
      startBtn.style.display = 'none';
      stopBtn.style.display = 'inline-flex';
    };

    recognition.onresult = (event) => {
      // Collect all alternatives into one string
      const candidates = [];
      for (let i = 0; i < event.results[0].length; i++) {
        candidates.push(event.results[0][i].transcript);
      }
      const text = candidates.join(' / ');
      statusEl.textContent = '📝 النص المستمع: ' + text;
      applyVoiceToForm(text, candidates[0]);
    };

    recognition.onerror = (event) => {
      console.error('Voice error:', event.error);
      statusEl.textContent = '❌ خطأ: ' + event.error;
      resetVoiceUI();
    };

    recognition.onend = () => {
      resetVoiceUI();
    };

    startBtn.addEventListener('click', () => {
      try {
        recognition.start();
      } catch (e) {
        // Already started
        statusEl.textContent = '🎙 جاري الاستماع بالفعل...';
      }
    });

    stopBtn.addEventListener('click', () => {
      recognition.stop();
    });

    function resetVoiceUI() {
      startBtn.style.display = 'inline-flex';
      stopBtn.style.display = 'none';
      if (statusEl.textContent.startsWith('🎙') || statusEl.textContent.startsWith('📝')) {
        statusEl.textContent = 'جاهز للتسجيل';
      }
    }

    // -----------------------------------------------------------
    // Parse Arabic speech into structured fields
    // Supported examples:
    //   "أكل خمسين جنيه"
    //   "مصروف نقل عشرين جنيه "
    //   "دفعت للصحة مئة جنيه "
    //   "مشوار تاكسي ثلاثين"
    // -----------------------------------------------------------
    function applyVoiceToForm(rawText, primaryTranscript) {
      const text = (primaryTranscript || rawText || '').trim();
      if (!text) return;

      // 1) Amount — find Arabic or Western digits
      //    Arabic digits: ٠١٢٣٤٥٦٧٨٩
      const arabicNumMap = {'٠':'0','١':'1','٢':'2','٣':'3','٤':'4','٥':'5','٦':'6','٧':'7','٨':'8','٩':'9'};
      let normalized = text.replace(/[٠-٩]/g, d => arabicNumMap[d] || d);

      // Patterns: "خمسين جنيه" / "مئة جنيه" / "25 جنيه" / "20"
      const amountPatterns = [
        /(\d+(?:\.\d+)?)\s*(?:جنيه|ج\.م|جنيهات|جم|قرش)?/i,
        /(?:خمسين|خمسة\s*عشر|ثلاثين|ثلاثة\s*عشر|عشرين|عشرة|مئة|مائة|مئتين|ألف|مليون)\s*(?:جنيه|ج\.م|جنيهات|جم)?/i
      ];

      let amount = null;
      // Try numeric first
      const numMatch = normalized.match(/(\d+(?:\.\d+)?)/);
      if (numMatch) {
        amount = parseFloat(numMatch[1]);
      } else {
        // Word-based amounts (limited set)
        const wordMap = {
          'عشرة':10, 'خمسة عشر':15, 'خمسين':50,
          'عشرين':20, 'ثلاثة عشر':13, 'ثلاثين':30,
          'مئة':100, 'مائة':100, 'مئتين':200,
          'ألف':1000, 'مليون':1000000
        };
        for (const [word, value] of Object.entries(wordMap)) {
          if (text.includes(word)) { amount = value; break; }
        }
      }

      // 2) Category — keyword matching
      const categoryKeywords = {
        'أكل': ['أكل','اكل','طعام','غداء','عشا','فطار','مطعم','مشروب','سناك'],
        'نقل': ['نقل','تاكسي','أوبر','اوبر','مشوار','مترو','باص','بنزين','وقود','مواصلات','سيارة'],
        'تسوق': ['سوق','تسوق','شراء','مشريات','خضار','فاكهة','ملابس','مول'],
        'صحة': ['صحة','دكتور','مستشفى','دواء','عيادة','تحليل','أشعة','علاج'],
        'ترفيه': ['ترفيه','سينما','لعبة','مباراة','حفلة','نزهة','تيك توك'],
        'فواتير': ['فاتورة','فواتير','كهرباء','مياه','غاز','انترنت','فيس','تليفون','اشتراك'],
      };

      let matchedCategory = null;
      const lower = text.toLowerCase();
      for (const [cat, keywords] of Object.entries(categoryKeywords)) {
        if (keywords.some(k => lower.includes(k))) {
          matchedCategory = cat;
          break;
        }
      }
      // Fallback: if text mentions "مصروف" without category → "أخرى"
      if (!matchedCategory && (lower.includes('مصروف') || lower.includes('صرف'))) {
        matchedCategory = 'أخرى';
      }

      // 3) Date hint — if user says "اليوم" / "أمس"
      const dateInput = document.getElementById('dateInput');
      const today = new Date();
      if (lower.includes('أمس')) {
        const d = new Date(today); d.setDate(d.getDate() - 1);
        dateInput.value = d.toISOString().split('T')[0];
      } else if (lower.includes('غد')) {
        // Usually means tomorrow (غداً)
        const d = new Date(today); d.setDate(d.getDate() + 1);
        dateInput.value = d.toISOString().split('T')[0];
      } else {
        dateInput.value = today.toISOString().split('T')[0];
      }

      // 4) Fill form
      if (amount) document.getElementById('amountInput').value = amount;
      if (matchedCategory) document.getElementById('categoryInput').value = matchedCategory;
      // Clean note from amount/category words for a readable note
      const noteText = text
        .replace(/(\d+(?:\.\d+)?)/g, '')
        .replace(/^(مصروف|صرف|دفعت|دفع|بلغ|تكلفة)\s*/i, '')
        .replace(/\s+/g, ' ')
        .trim();
      if (noteText) document.getElementById('noteInput').value = noteText;

      statusEl.textContent = '✅ تم تعبئة البيانات من الصوت — اضغط "إضافة" للحفظ';
    }
  })();
</script>
</body>
</html>
