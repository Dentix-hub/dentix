name: DENTIX agent task
description: Create a bounded task suitable for AI implementation following the lean development workflow.
title: "[DTX] "
body:
  - type: markdown
    attributes:
      value: |
        Use this form for one coherent, bounded DENTIX objective following `docs/engineering/DEVELOPMENT_WORKFLOW.md`.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the observed problem or motivation.
    validations:
      required: true

  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: State one concise, observable outcome.
    validations:
      required: true

  - type: input
    id: source_spec
    attributes:
      label: Source spec or approved plan
      description: Repository path, documentation link, or approved requirement reference.
      placeholder: docs/...md — Section X
    validations:
      required: false

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: List the work explicitly included in this task.
      placeholder: |
        - ...
        - ...
    validations:
      required: true

  - type: textarea
    id: non_goals
    attributes:
      label: Explicit non-goals
      description: List work this task must not perform.
      placeholder: |
        - ...
        - ...
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Name blocking issues, prerequisites, or contracts (or state None).
      placeholder: None
    validations:
      required: true

  - type: textarea
    id: sensitive_surfaces
    attributes:
      label: Sensitive surfaces / risk notes
      description: Note if touching auth, RBAC, tenancy/RLS, finance, database migrations, clinical semantics, or shared API contracts.
      placeholder: None (or describe sensitive surface and independent review requirement)
    validations:
      required: false

  - type: textarea
    id: expected_touch_surface
    attributes:
      label: Expected touch surface
      description: List expected production modules/files where useful.
      placeholder: |
        - path/to/module
        - path/to/test
    validations:
      required: false

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance criteria
      description: Every criterion must be observable and use Markdown task-list syntax.
      placeholder: |
        - [ ] Observable criterion one
        - [ ] Observable criterion two
    validations:
      required: true

  - type: input
    id: domain_skills
    attributes:
      label: Primary domain skill
      description: Primary native domain skill required (e.g. dentix-frontend-react, dentix-backend-fastapi).
      placeholder: dentix-frontend-react
    validations:
      required: false

  - type: textarea
    id: completion_evidence
    attributes:
      label: Completion evidence
      description: Evidence required before task is marked completed.
      placeholder: |
        - [ ] Targeted test commands and results recorded
        - [ ] Acceptance criteria checklist satisfied
        - [ ] Working tree clean and diff inspected
    validations:
      required: true

  - type: checkboxes
    id: constraints
    attributes:
      label: DENTIX constraints acknowledged
      options:
        - label: Tenant isolation, RBAC, privacy, data integrity, API/database contracts, and branch governance remain authoritative.
          required: true
        - label: AI assistants must not poll CI in a loop; stop active execution after opening a PR or triggering CI.
          required: true
        - label: The implementer will not merge or claim broader completion than this task.
          required: true
