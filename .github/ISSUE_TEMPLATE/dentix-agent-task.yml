name: DENTIX agent task
description: Create a bounded, dependency-aware task suitable for isolated AI implementation.
title: "[DTX] "
body:
  - type: markdown
    attributes:
      value: |
        Use this form for one coherent, independently reviewable DENTIX objective. Master plans remain strategic sources; this issue is the executable contract.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the observed problem and why it matters.
    validations:
      required: true

  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: State one concise, observable outcome.
    validations:
      required: true

  - type: input
    id: source_spec
    attributes:
      label: Source spec or plan
      description: Link or repository path, including relevant requirement IDs.
      placeholder: docs/...md — P1.1, P1.2
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: List the work explicitly included in this ticket.
      placeholder: |
        - ...
        - ...
    validations:
      required: true

  - type: textarea
    id: non_goals
    attributes:
      label: Explicit non-goals
      description: List work this ticket must not perform.
      placeholder: |
        - ...
        - ...
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Name blocking issues/contracts, or state None with a short justification.
    validations:
      required: true

  - type: dropdown
    id: parallel_classification
    attributes:
      label: Parallel classification
      description: No ticket is implicitly parallel-safe.
      options:
        - PARALLEL_SAFE
        - PARALLEL_AFTER:<ticket>
        - SERIAL_ONLY
    validations:
      required: true

  - type: textarea
    id: expected_touch_surface
    attributes:
      label: Expected touch surface
      description: List expected production files/modules. Stop or report scope expansion before touching an unlisted production file; necessary tests are not excluded.
      placeholder: |
        - path/to/module
        - path/to/test
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance criteria
      description: Every criterion must be observable and use Markdown task-list syntax.
      placeholder: |
        - [ ] Observable criterion one
        - [ ] Observable criterion two
    validations:
      required: true

  - type: textarea
    id: required_skills
    attributes:
      label: Required DENTIX skills
      description: List every native .agents/skills policy required for implementation, verification, and review.
      placeholder: dentix-plan-execution, dentix-frontend-react, dentix-testing-verification, dentix-code-review
    validations:
      required: true

  - type: dropdown
    id: risk
    attributes:
      label: Risk classification
      description: Select every applicable risk. High-risk work defaults to serial execution.
      multiple: true
      options:
        - LOW
        - NORMAL
        - CLINICAL
        - FINANCE
        - AUTH_RBAC
        - TENANCY_RLS
        - DATABASE_MIGRATION
        - DEPLOYMENT
        - SECURITY
    validations:
      required: true

  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: List targeted and broad verification commands/classes. CI and current package scripts remain authoritative.
      placeholder: |
        - Command/class: ...
        - Expected evidence: exit status, counts, and failure classification
    validations:
      required: true

  - type: textarea
    id: completion_evidence
    attributes:
      label: Completion evidence
      description: Define the diff, acceptance, review, test, CI, and limitation evidence required before verification.
      placeholder: |
        - [ ] Diff and unexpected files reviewed
        - [ ] Acceptance criteria checked individually
        - [ ] Independent review complete
        - [ ] Exact verification commands and exit statuses recorded
    validations:
      required: true

  - type: checkboxes
    id: constraints
    attributes:
      label: DENTIX constraints acknowledged
      options:
        - label: Tenant isolation, RBAC, privacy, data integrity, API/database contracts, and branch governance remain authoritative.
          required: true
        - label: The implementer will not merge or claim broader completion than this ticket.
          required: true
