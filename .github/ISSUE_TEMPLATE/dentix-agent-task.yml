name: DENTIX agent task
description: Create a bounded, dependency-aware task suitable for isolated AI implementation.
title: "[DTX] "
body:
  - type: markdown
    attributes:
      value: |
        Use this form for one coherent, bounded DENTIX objective. Master plans remain strategic sources; this issue is the executable scope contract.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the observed problem and why it matters.
    validations:
      required: true

  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: State one concise, observable outcome.
    validations:
      required: true

  - type: input
    id: source_spec
    attributes:
      label: Source spec or plan
      description: Link or repository path, including relevant requirement IDs.
      placeholder: docs/...md — P1.1, P1.2
    validations:
      required: true

  - type: dropdown
    id: execution_mode
    attributes:
      label: Execution mode
      description: FAST (tests/docs/isolated UI <= 3 files), STANDARD (wave <= 5 tickets), HIGH_RISK (strict controls).
      options:
        - FAST
        - STANDARD
        - HIGH_RISK
    validations:
      required: true

  - type: input
    id: wave_id
    attributes:
      label: Wave ID
      description: Execution wave identifier (e.g. ODG-L1, ODG-L3, WAVE-01, or NONE for standalone).
      placeholder: ODG-L1
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: List the work explicitly included in this ticket.
      placeholder: |
        - ...
        - ...
    validations:
      required: true

  - type: textarea
    id: non_goals
    attributes:
      label: Explicit non-goals
      description: List work this ticket must not perform.
      placeholder: |
        - ...
        - ...
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Name blocking issues/contracts, or state None with a short justification.
    validations:
      required: true

  - type: dropdown
    id: parallel_classification
    attributes:
      label: Parallel classification
      description: No ticket is implicitly parallel-safe.
      options:
        - PARALLEL_SAFE
        - PARALLEL_AFTER:<ticket>
        - SERIAL_ONLY
    validations:
      required: true

  - type: dropdown
    id: risk
    attributes:
      label: Risk classification
      description: Select every applicable risk. High-risk and clinical-semantics work default to serial execution.
      multiple: true
      options:
        - LOW
        - NORMAL
        - CLINICAL_UI
        - CLINICAL_SEMANTICS
        - FINANCE
        - AUTH_RBAC
        - TENANCY_RLS
        - DATABASE_MIGRATION
        - DEPLOYMENT
        - SECURITY
    validations:
      required: true

  - type: dropdown
    id: verification_tier
    attributes:
      label: Verification tier
      description: T1 (targeted ticket check), T2 (wave/phase gate), T3 (repository CI).
      options:
        - T1_TARGETED
        - T2_WAVE_GATE
        - T3_FULL_INTEGRATION
    validations:
      required: true

  - type: dropdown
    id: review_policy
    attributes:
      label: Review policy
      description: Review cadence for this ticket.
      options:
        - MECHANICAL_INSPECTION_FAST
        - INDEPENDENT_WAVE_REVIEW_STANDARD
        - PER_TICKET_INDEPENDENT_REVIEW_HIGH_RISK
    validations:
      required: true

  - type: dropdown
    id: pr_strategy
    attributes:
      label: PR strategy
      description: How this ticket is integrated.
      options:
        - WAVE_PR
        - INDIVIDUAL_PR
    validations:
      required: true

  - type: textarea
    id: expected_touch_surface
    attributes:
      label: Expected touch surface
      description: List expected production files/modules (pilot cap <= 3 for FAST). Stop immediately (drift-abort) before modifying unlisted production files.
      placeholder: |
        - path/to/module
        - path/to/test
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance criteria
      description: Every criterion must be observable and use Markdown task-list syntax.
      placeholder: |
        - [ ] Observable criterion one
        - [ ] Observable criterion two
    validations:
      required: true

  - type: input
    id: domain_skills
    attributes:
      label: Primary domain skill
      description: Primary native domain skill required (e.g. dentix-frontend-react, dentix-backend-fastapi).
      placeholder: dentix-frontend-react
    validations:
      required: true

  - type: textarea
    id: completion_evidence
    attributes:
      label: Completion evidence
      description: Evidence required before ticket is marked IMPLEMENTED / VERIFIED.
      placeholder: |
        - [ ] Diff inspected within expected touch surface
        - [ ] T1 targeted test commands and exit codes recorded
        - [ ] Acceptance criteria checklist satisfied
    validations:
      required: true

  - type: checkboxes
    id: constraints
    attributes:
      label: DENTIX constraints acknowledged
      options:
        - label: Tenant isolation, RBAC, privacy, data integrity, API/database contracts, and branch governance remain authoritative.
          required: true
        - label: Model-driven CI polling is forbidden; stop upon reaching AWAITING_CI.
          required: true
        - label: The implementer will not merge or claim broader completion than this ticket.
          required: true
