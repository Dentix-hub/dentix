name: Dentix PostgreSQL HTTP IDOR Gate

on:
  pull_request:
    branches: [main, staging]
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  push:
    branches: [main, staging]

permissions:
  contents: read

concurrency:
  group: dentix-pg-http-idor-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  postgres-http-idor:
    name: PostgreSQL HTTP Cross-Tenant BOLA Matrix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DB_SSL_MODE: disable
      SECRET_KEY: pg-http-idor-secret-key-for-ci-at-least-32
      ENVIRONMENT: test
      PYTHONPATH: .
      ENABLE_IN_PROCESS_WORKERS: 'false'

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: dentix_idor
        options: >-
          --health-cmd "pg_isready -U test_user -d dentix_idor"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Fetch base branch for PR diff
        if: github.event_name == 'pull_request'
        run: git fetch --depth=50 origin ${{ github.base_ref }} || true

      - name: Classify CI Scope
        id: classify
        env:
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels) }}
        run: |
          set -euo pipefail
          python .github/scripts/classify_ci_scope.py \
            --event "${{ github.event_name }}" \
            --target-branch "${{ github.base_ref || github.ref_name }}" \
            --base-ref "origin/${{ github.base_ref || 'staging' }}" \
            --labels-json "${PR_LABELS:-[]}" \
            --output-format github-output

      - name: Skip notice when tenancy / backend untouched
        if: ${{ !cancelled() && steps.classify.outcome == 'success' && steps.classify.outputs.force_full == 'false' && steps.classify.outputs.tenancy == 'false' && steps.classify.outputs.auth == 'false' && steps.classify.outputs.security == 'false' && steps.classify.outputs.backend == 'false' }}
        run: echo "Auth, tenancy, security, and backend untouched; skipping HTTP IDOR gate safely."

      - name: Set up Python 3.11
        if: ${{ !cancelled() && (steps.classify.outcome != 'success' || steps.classify.outputs.force_full != 'false' || steps.classify.outputs.tenancy == 'true' || steps.classify.outputs.auth == 'true' || steps.classify.outputs.security == 'true' || steps.classify.outputs.backend == 'true') }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned uv
        if: ${{ !cancelled() && (steps.classify.outcome != 'success' || steps.classify.outputs.force_full != 'false' || steps.classify.outputs.tenancy == 'true' || steps.classify.outputs.auth == 'true' || steps.classify.outputs.security == 'true' || steps.classify.outputs.backend == 'true') }}
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.5'

      - name: Install dependencies from frozen lock
        if: ${{ !cancelled() && (steps.classify.outcome != 'success' || steps.classify.outputs.force_full != 'false' || steps.classify.outputs.tenancy == 'true' || steps.classify.outputs.auth == 'true' || steps.classify.outputs.security == 'true' || steps.classify.outputs.backend == 'true') }}
        run: |
          set -euo pipefail
          uv sync --frozen
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Initialize PostgreSQL via production preflight
        if: ${{ !cancelled() && (steps.classify.outcome != 'success' || steps.classify.outputs.force_full != 'false' || steps.classify.outputs.tenancy == 'true' || steps.classify.outputs.auth == 'true' || steps.classify.outputs.security == 'true' || steps.classify.outputs.backend == 'true') }}
        env:
          DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/dentix_idor
        run: python -m backend.scripts.preflight_migrations

      - name: Provision NOBYPASSRLS application role
        if: ${{ !cancelled() && (steps.classify.outcome != 'success' || steps.classify.outputs.force_full != 'false' || steps.classify.outputs.tenancy == 'true' || steps.classify.outputs.auth == 'true' || steps.classify.outputs.security == 'true' || steps.classify.outputs.backend == 'true') }}
        env:
          DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/dentix_idor
        run: |
          python - <<'PY'
          import os
          import psycopg2

          with psycopg2.connect(os.environ['DATABASE_URL']) as conn:
              conn.autocommit = True
              with conn.cursor() as cur:
                  cur.execute(
                      """
                      CREATE ROLE dentix_idor_app WITH
                          LOGIN PASSWORD 'dentix_idor_app_pass'
                          NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT
                          NOREPLICATION NOBYPASSRLS
                      """
                  )
                  cur.execute(
                      """
                      CREATE ROLE dentix_idor_system WITH
                          LOGIN PASSWORD 'dentix_idor_system_pass'
                          NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT
                          NOREPLICATION BYPASSRLS
                      """
                  )
                  cur.execute("GRANT CONNECT ON DATABASE dentix_idor TO dentix_idor_app")
                  cur.execute("GRANT CONNECT ON DATABASE dentix_idor TO dentix_idor_system")
                  cur.execute("GRANT USAGE ON SCHEMA public TO dentix_idor_app")
                  cur.execute("GRANT USAGE ON SCHEMA public TO dentix_idor_system")
                  cur.execute(
                      "GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO dentix_idor_app"
                  )
                  cur.execute(
                      "GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO dentix_idor_system"
                  )
                  cur.execute(
                      "GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA public TO dentix_idor_app"
                  )
                  cur.execute(
                      "GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA public TO dentix_idor_system"
                  )
          PY

      - name: Run HTTP BOLA and upload matrix through PostgreSQL FORCE RLS
        if: ${{ !cancelled() && (steps.classify.outcome != 'success' || steps.classify.outputs.force_full != 'false' || steps.classify.outputs.tenancy == 'true' || steps.classify.outputs.auth == 'true' || steps.classify.outputs.security == 'true' || steps.classify.outputs.backend == 'true') }}
        env:
          APP_DATABASE_URL_PREFIX: postgresql://dentix_idor_app
          APP_DATABASE_URL_SUFFIX: :dentix_idor_app_pass@localhost:5432/dentix_idor
          SYSTEM_DATABASE_URL_PREFIX: postgresql://dentix_idor_system
          SYSTEM_DATABASE_URL_SUFFIX: :dentix_idor_system_pass@localhost:5432/dentix_idor
        run: |
          export DATABASE_URL="${APP_DATABASE_URL_PREFIX}${APP_DATABASE_URL_SUFFIX}"
          export SYSTEM_DATABASE_URL="${SYSTEM_DATABASE_URL_PREFIX}${SYSTEM_DATABASE_URL_SUFFIX}"
          pytest \
            backend/ci_tests/test_cross_tenant_http_postgres.py \
            backend/ci_tests/test_upload_postgres_smoke.py \
            -v \
            --tb=short \
            --confcutdir=backend/ci_tests
