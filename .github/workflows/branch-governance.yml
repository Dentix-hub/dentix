name: Dentix Governance

on:
  pull_request:
    branches: [main, staging]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main, staging]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  promotion-path:
    name: Validate promotion path
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR source and target
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Validating ${HEAD_BRANCH} -> ${BASE_BRANCH}"

          if [ "$BASE_BRANCH" = "main" ]; then
            case "$HEAD_BRANCH" in
              staging|hotfix/*|release/*)
                echo "Allowed production promotion path."
                ;;
              *)
                echo "::error::Production PRs must come from staging, a documented release/* reconciliation branch, or an explicitly scoped hotfix/* branch."
                exit 1
                ;;
            esac
            exit 0
          fi

          if [ "$BASE_BRANCH" = "staging" ]; then
            case "$HEAD_BRANCH" in
              feat/*|feature/*|fix/*|refactor/*|chore/*|docs/*|test/*|hotfix/*)
                echo "Allowed staging integration path."
                ;;
              *)
                echo "::error::Staging PRs must come from a scoped feat/feature/fix/refactor/chore/docs/test/hotfix branch."
                exit 1
                ;;
            esac
            exit 0
          fi

          echo "::error::Unexpected protected target: ${BASE_BRANCH}"
          exit 1

  workflow-authority:
    name: Protect authoritative CD workflow
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Protect authoritative CD workflow
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin main staging

          if [ "$BASE_BRANCH" = "staging" ]; then
            if ! git diff --quiet origin/main -- .github/workflows/cd.yml; then
              echo "::error::.github/workflows/cd.yml must stay aligned with the authoritative main copy. Update main intentionally first, then sync staging."
              git diff -- .github/workflows/cd.yml || true
              exit 1
            fi
            echo "CD workflow matches authoritative main copy."
            exit 0
          fi

          if [ "$BASE_BRANCH" = "main" ] && [ "$HEAD_BRANCH" = "staging" ]; then
            CURRENT_STAGING_SHA="$(git rev-parse origin/staging)"
            if [ "$PR_HEAD_SHA" != "$CURRENT_STAGING_SHA" ]; then
              echo "::error::Promotion head ${PR_HEAD_SHA} is stale; current protected staging is ${CURRENT_STAGING_SHA}."
              exit 1
            fi
            echo "Promotion targets the current protected staging revision."
            exit 0
          fi

          if [ "$BASE_BRANCH" = "main" ]; then
            if ! git diff --quiet origin/main -- .github/workflows/cd.yml; then
              echo "::error::Direct hotfix/release promotions must not mutate the authoritative CD workflow."
              git diff origin/main -- .github/workflows/cd.yml || true
              exit 1
            fi
            echo "Authoritative CD workflow is unchanged."
            exit 0
          fi

          echo "::error::Unexpected protected target: ${BASE_BRANCH}"
          exit 1

  verify-platform-branch-rules:
    name: Verify GitHub branch enforcement
    runs-on: ubuntu-latest
    steps:
      - name: Verify main and staging rules
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          repo = os.environ["GH_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "dentix-branch-protection-gate",
          }

          def get_json(path):
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/{path}",
                  headers=headers,
              )
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      return json.load(response)
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode("utf-8", errors="replace")
                  print(f"::error::GitHub API {exc.code} for {path}: {body[:500]}")
                  raise

          failures = []
          for branch in ("main", "staging"):
              branch_meta = get_json(f"branches/{urllib.parse.quote(branch, safe='')}")
              if branch_meta.get("protected") is not True:
                  failures.append(f"{branch}: GitHub reports protected=false")

              rules = get_json(f"rules/branches/{urllib.parse.quote(branch, safe='')}")
              by_type = {rule.get("type"): rule for rule in rules if isinstance(rule, dict)}

              for required_type in (
                  "pull_request",
                  "required_status_checks",
                  "non_fast_forward",
                  "deletion",
              ):
                  if required_type not in by_type:
                      failures.append(f"{branch}: missing applicable {required_type} rule")

              pull_request_rule = by_type.get("pull_request", {})
              pull_params = pull_request_rule.get("parameters") or {}
              if pull_request_rule and pull_params.get("required_review_thread_resolution") is not True:
                  failures.append(
                      f"{branch}: pull-request rule must require review-thread resolution"
                  )

              status_rule = by_type.get("required_status_checks", {})
              status_params = status_rule.get("parameters") or {}
              checks = status_params.get("required_status_checks") or []
              if status_rule and not checks:
                  failures.append(f"{branch}: required-status-checks rule has no checks")
              if status_rule and status_params.get("strict_required_status_checks_policy") is not True:
                  failures.append(
                      f"{branch}: required status checks must require an up-to-date branch"
                  )

              print(
                  f"{branch}: protected={branch_meta.get('protected')}; "
                  f"applicable_rules={sorted(by_type)}"
              )

          if failures:
              for failure in failures:
                  print(f"::error::{failure}")
              sys.exit(1)

          print("GitHub platform branch enforcement satisfies the Dentix release contract.")
          PY
