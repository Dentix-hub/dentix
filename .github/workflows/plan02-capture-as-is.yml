name: Plan 02 — Capture AS-IS UI Baselines

on:
  push:
    branches:
      - refactor/plan-02-design-system-ui-regression
    paths:
      - .github/workflows/plan02-capture-as-is.yml

permissions:
  contents: write

jobs:
  capture:
    name: Capture AS-IS Playwright baselines
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: e2e_user
          POSTGRES_PASSWORD: e2e_pass
          POSTGRES_DB: dentix_e2e
        options: >-
          --health-cmd "pg_isready -U e2e_user -d dentix_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://e2e_user:e2e_pass@localhost:5432/dentix_e2e
      SECRET_KEY: e2e-secret-key-for-ci-only-at-least-32
      ENVIRONMENT: test
      PYTHONPATH: .
      ENABLE_IN_PROCESS_WORKERS: 'false'
      FRONTEND_URL: http://localhost:5173
      CORS_ORIGINS: http://localhost:5173
      VITE_API_URL: http://localhost:8000/api/v1
      VITE_API_BASE_URL: http://localhost:8000
      PLAYWRIGHT_BASE_URL: http://localhost:5173

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/plan-02-design-system-ui-regression

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install backend dependencies
        run: |
          pip install -r requirements.txt
          pip uninstall -y ecdsa

      - name: Initialize E2E database
        run: python backend/scripts/init_db.py

      - name: Start backend
        shell: bash
        run: |
          set -euo pipefail
          nohup uvicorn backend.main:app --host 127.0.0.1 --port 8000 > /tmp/dentix-plan02-baseline-backend.log 2>&1 &
          echo $! > /tmp/dentix-plan02-baseline-backend.pid

          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:8000/api/v1/health > /dev/null; then
              echo "Backend is ready."
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/dentix-plan02-baseline-backend.pid)" 2>/dev/null; then
              echo "Backend exited before becoming ready."
              cat /tmp/dentix-plan02-baseline-backend.log
              exit 1
            fi
            sleep 2
          done

          echo "Backend did not become ready in time."
          cat /tmp/dentix-plan02-baseline-backend.log
          exit 1

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Prepare isolated E2E data
        working-directory: frontend
        run: npx playwright test e2e/setup.spec.ts --config=playwright.config.ts --project=setup --retries=0

      - name: Generate AS-IS screenshots
        working-directory: frontend
        run: npx playwright test e2e/ui-regression.spec.ts --config=playwright.config.ts --project=visual-desktop --project=visual-mobile --no-deps --retries=0 --update-snapshots

      - name: Verify expected baseline set
        shell: bash
        run: |
          set -euo pipefail
          test -f frontend/e2e/ui-regression.spec.ts-snapshots/patients-ar-light-visual-desktop-linux.png
          test -f frontend/e2e/ui-regression.spec.ts-snapshots/patients-en-dark-visual-desktop-linux.png
          test -f frontend/e2e/ui-regression.spec.ts-snapshots/patients-ar-light-visual-mobile-linux.png

      - name: Commit baselines and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/e2e/ui-regression.spec.ts-snapshots/
          git rm .github/workflows/plan02-capture-as-is.yml
          git commit -m "test(ui): capture as-is visual regression baselines"
          git push origin HEAD:refactor/plan-02-design-system-ui-regression
