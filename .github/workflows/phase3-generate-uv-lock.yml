name: Phase 3 Generate uv Lock

on:
  pull_request:
    branches: [staging]
    paths:
      - pyproject.toml
      - .github/workflows/phase3-generate-uv-lock.yml

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.5'

      - name: Generate canonical lock
        run: uv lock

      - name: Verify security and compatibility invariants
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen
          uv run --frozen python - <<'PY'
          from jose import jwt
          import chromadb
          secret = 'dentix-phase3-build-smoke-secret-32chars'
          token = jwt.encode({'sub': 'build'}, secret, algorithm='HS256')
          assert jwt.decode(token, secret, algorithms=['HS256'])['sub'] == 'build'
          assert chromadb.__version__ == '0.6.3', chromadb.__version__
          PY
          if grep -Eq '^name = "ecdsa"$' uv.lock; then
            echo 'ecdsa unexpectedly present in uv.lock'
            exit 1
          fi

      - name: Commit reviewed lock once
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files --error-unmatch uv.lock >/dev/null 2>&1; then
            echo 'uv.lock already tracked; nothing to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- uv.lock
          git commit -m 'chore: add canonical uv lock'
          git push origin HEAD:${{ github.head_ref }}

      - name: Upload uv.lock
        uses: actions/upload-artifact@v4
        with:
          name: dentix-uv-lock
          path: uv.lock
          if-no-files-found: error
          retention-days: 2
