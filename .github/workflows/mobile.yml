name: Mobile CI (Flutter)

on:
  push:
    branches: [ main, staging ]
    paths:
      - 'dentix_mobile/**'
      - '.github/workflows/mobile.yml'
  pull_request:
    branches: [ main, staging ]
    paths:
      - 'dentix_mobile/**'
      - '.github/workflows/mobile.yml'

concurrency:
  group: dentix-mobile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flutter-analyze-test:
    name: Flutter Analyze + Test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    defaults:
      run:
        working-directory: dentix_mobile

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Java for Android builds
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Print Flutter version
        run: flutter --version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Export Dart formatter output
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/program-wide-defect-audit-20260823'
        shell: bash
        run: |
          set -euo pipefail
          dart format lib test
          mapfile -t changed < <(git diff --name-only -- lib test)
          if [ ${#changed[@]} -eq 0 ]; then
            echo "Dart sources already formatted."
            exit 0
          fi
          printf '%s\n' "${changed[@]}"
          tar -czf /tmp/dart-formatted.tar.gz "${changed[@]}"
          echo "DART_FORMATTED_TAR_GZ_BASE64_BEGIN"
          base64 -w 0 /tmp/dart-formatted.tar.gz
          echo
          echo "DART_FORMATTED_TAR_GZ_BASE64_END"
          exit 1

      - name: Verify Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Static analysis
        run: flutter analyze --fatal-infos

      - name: Run unit and widget tests
        run: flutter test --reporter expanded

      - name: Build debug APK (smoke)
        env:
          DENTIX_API_BASE_URL: https://dentix-dentix-staging.hf.space
        run: flutter build apk --debug --dart-define=DENTIX_API_BASE_URL=$DENTIX_API_BASE_URL
