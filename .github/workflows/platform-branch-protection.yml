name: Dentix Platform Branch Protection

on:
  pull_request:
    branches: [main, staging]
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  push:
    branches: [main, staging]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-platform-branch-rules:
    name: ${{ github.event.action == 'labeled' && startsWith(github.event.label.name, 'agent:') && 'Agent label no-op / Verify GitHub branch enforcement' || 'Verify GitHub branch enforcement' }}
    if: >-
      github.event.action != 'labeled' ||
      !startsWith(github.event.label.name, 'agent:')
    runs-on: ubuntu-latest
    steps:
      - name: Verify main and staging rules
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          repo = os.environ["GH_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "dentix-branch-protection-gate",
          }

          def get_json(path):
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/{path}",
                  headers=headers,
              )
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      return json.load(response)
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode("utf-8", errors="replace")
                  print(f"::error::GitHub API {exc.code} for {path}: {body[:500]}")
                  raise

          failures = []
          for branch in ("main", "staging"):
              branch_meta = get_json(f"branches/{urllib.parse.quote(branch, safe='')}")
              if branch_meta.get("protected") is not True:
                  failures.append(f"{branch}: GitHub reports protected=false")

              rules = get_json(f"rules/branches/{urllib.parse.quote(branch, safe='')}")
              by_type = {rule.get("type"): rule for rule in rules if isinstance(rule, dict)}

              for required_type in (
                  "pull_request",
                  "required_status_checks",
                  "non_fast_forward",
                  "deletion",
              ):
                  if required_type not in by_type:
                      failures.append(f"{branch}: missing applicable {required_type} rule")

              pull_request_rule = by_type.get("pull_request", {})
              pull_params = pull_request_rule.get("parameters") or {}
              if pull_request_rule and pull_params.get("required_review_thread_resolution") is not True:
                  failures.append(
                      f"{branch}: pull-request rule must require review-thread resolution"
                  )

              status_rule = by_type.get("required_status_checks", {})
              status_params = status_rule.get("parameters") or {}
              checks = status_params.get("required_status_checks") or []
              if status_rule and not checks:
                  failures.append(f"{branch}: required-status-checks rule has no checks")
              if status_rule and status_params.get("strict_required_status_checks_policy") is not True:
                  failures.append(
                      f"{branch}: required status checks must require an up-to-date branch"
                  )

              print(
                  f"{branch}: protected={branch_meta.get('protected')}; "
                  f"applicable_rules={sorted(by_type)}"
              )

          if failures:
              for failure in failures:
                  print(f"::error::{failure}")
              sys.exit(1)

          print("GitHub platform branch enforcement satisfies the Dentix release contract.")
          PY
