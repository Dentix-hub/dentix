name: Dentix CD

on:
  workflow_run:
    workflows: ["Dentix CI"]
    types: [completed]
    branches: [main, staging]
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read
  packages: read

jobs:
  deploy-staging:
    name: Deploy staging to Hugging Face
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.target == 'staging') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'staging')
    concurrency:
      group: dentix-staging-deployment
      cancel-in-progress: true
    environment: staging

    steps:
      - name: Checkout the tested revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Push tested revision to Hugging Face staging
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_STAGING_SPACE: ${{ secrets.HF_STAGING_SPACE }}
          DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          test -n "$HF_TOKEN"
          test -n "$HF_STAGING_SPACE"
          git remote add hf "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_STAGING_SPACE}"
          git push hf "${DEPLOY_SHA}:refs/heads/main" --force

      - name: Verify staging health
        env:
          STAGING_BACKEND_URL: ${{ secrets.STAGING_BACKEND_URL }}
        run: |
          set -euo pipefail
          test -n "$STAGING_BACKEND_URL"
          HEALTH_URL="${STAGING_BACKEND_URL%/}"
          case "$HEALTH_URL" in
            */api/v1/health) ;;
            */api/v1) HEALTH_URL="${HEALTH_URL}/health" ;;
            *) HEALTH_URL="${HEALTH_URL}/api/v1/health" ;;
          esac
          curl --fail --show-error --retry 15 --retry-delay 12 --retry-all-errors "$HEALTH_URL"

  deploy-production:
    name: Deploy production to Hugging Face
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.target == 'production') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    concurrency:
      group: dentix-production-deployment
      cancel-in-progress: false
    environment: production

    steps:
      - name: Checkout the tested revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Verify tested revision is current main
        env:
          DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          git fetch origin main
          test "$DEPLOY_SHA" = "$(git rev-parse origin/main)"

      - name: Push tested revision to Hugging Face production
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_PRODUCTION_SPACE: ${{ secrets.HF_PRODUCTION_SPACE }}
          DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          test -n "$HF_TOKEN"
          test -n "$HF_PRODUCTION_SPACE"
          git remote add hf "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_PRODUCTION_SPACE}"
          git push hf "${DEPLOY_SHA}:refs/heads/main" --force

      - name: Verify production health
        env:
          PRODUCTION_BACKEND_URL: ${{ secrets.PRODUCTION_BACKEND_URL }}
        run: |
          set -euo pipefail
          test -n "$PRODUCTION_BACKEND_URL"
          HEALTH_URL="${PRODUCTION_BACKEND_URL%/}"
          case "$HEALTH_URL" in
            */api/v1/health) ;;
            */api/v1) HEALTH_URL="${HEALTH_URL}/health" ;;
            *) HEALTH_URL="${HEALTH_URL}/api/v1/health" ;;
          esac
          curl --fail --show-error --retry 30 --retry-delay 12 --retry-all-errors "$HEALTH_URL"
