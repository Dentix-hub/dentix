name: Dentix CD

# IMPORTANT:
# GitHub executes workflow_run workflows from the repository default branch.
# `main` is therefore the authoritative source for this CD workflow even when
# the tested revision belongs to `staging`. Keep this file on main deploy-safe.

on:
  workflow_run:
    workflows: ["Dentix CI"]
    types: [completed]
    branches: [main, staging]
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read
  packages: read

jobs:
  deploy-staging:
    name: Deploy staging to Hugging Face
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main' &&
       inputs.target == 'staging') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'staging')
    concurrency:
      group: dentix-staging-deployment
      cancel-in-progress: true
    environment: staging

    steps:
      - name: Checkout the tested staging revision
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          lfs: true
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'staging' }}

      - name: Verify staging revision identity
        env:
          EXPECTED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [ -n "$EXPECTED_SHA" ]; then
            test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          fi
          echo "Deploying staging revision: $ACTUAL_SHA"

      - name: Sync tested revision to Hugging Face staging
        uses: huggingface/hub-sync@v0.1.0
        with:
          github_repo_id: ${{ github.repository }}
          huggingface_repo_id: ${{ secrets.HF_STAGING_SPACE }}
          hf_token: ${{ secrets.HF_TOKEN }}
          repo_type: space
          space_sdk: docker

      - name: Verify staging health
        env:
          STAGING_BACKEND_URL: ${{ secrets.STAGING_BACKEND_URL }}
        run: |
          set -euo pipefail
          test -n "$STAGING_BACKEND_URL"
          HEALTH_URL="${STAGING_BACKEND_URL%/}"
          case "$HEALTH_URL" in
            */api/v1/health) ;;
            */api/v1) HEALTH_URL="${HEALTH_URL}/health" ;;
            *) HEALTH_URL="${HEALTH_URL}/api/v1/health" ;;
          esac
          curl --fail --show-error --retry 20 --retry-delay 12 --retry-all-errors "$HEALTH_URL"

      - name: Resolve staging application base URL
        env:
          STAGING_BACKEND_URL: ${{ secrets.STAGING_BACKEND_URL }}
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="${STAGING_BACKEND_URL%/}"
          case "$BASE_URL" in
            */api/v1/health) BASE_URL="${BASE_URL%/api/v1/health}" ;;
            */api/v1) BASE_URL="${BASE_URL%/api/v1}" ;;
          esac
          test -n "$BASE_URL"
          echo "STAGING_BASE_URL=$BASE_URL" >> "$GITHUB_ENV"

      - name: Set up Node.js 20 for production-like staging smoke
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install staging smoke dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Chromium for staging smoke
        working-directory: frontend
        run: npx playwright install chromium

      - name: Run production-like staging smoke
        working-directory: frontend
        env:
          STAGING_BASE_URL: ${{ env.STAGING_BASE_URL }}
        run: >-
          npx playwright test
          --config=playwright.staging.config.ts
          --project=staging-chromium
          --retries=0

      - name: Upload staging smoke diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: staging-production-smoke-diagnostics
          path: |
            frontend/playwright-report/
            frontend/test-results/

  production-change-gate:
    name: Classify production deployment change
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main' &&
       inputs.target == 'production') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    outputs:
      deploy: ${{ steps.gate.outputs.deploy }}

    steps:
      - name: Checkout candidate production revision
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'main' }}

      - name: Decide whether production content changed
        id: gate
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "Manual production deployment requested."
            exit 0
          fi

          DEPLOY_SHA="$(git rev-parse HEAD)"
          if ! git cat-file -e "${DEPLOY_SHA}^" 2>/dev/null; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "No parent commit available; fail-safe to deployment."
            exit 0
          fi

          # A workflow-only change must never rebuild production merely to repair
          # CI/CD orchestration. Any application/configuration/docs change still
          # follows the normal automatic main -> production path.
          if git diff --quiet "${DEPLOY_SHA}^" "$DEPLOY_SHA" -- . ':(exclude).github/workflows/**'; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Only GitHub workflow files changed; production deployment skipped."
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "Deployable production content changed."
          fi

  deploy-production:
    name: Deploy production to Hugging Face
    runs-on: ubuntu-latest
    needs: production-change-gate
    if: needs.production-change-gate.outputs.deploy == 'true'
    concurrency:
      group: dentix-production-deployment
      cancel-in-progress: false
    environment: production

    steps:
      - name: Checkout the tested production revision
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          lfs: true
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'main' }}

      - name: Verify tested revision is current main
        env:
          EXPECTED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          git fetch --depth=1 origin main
          test "$ACTUAL_SHA" = "$(git rev-parse origin/main)"
          if [ -n "$EXPECTED_SHA" ]; then
            test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          fi
          echo "Deploying production revision: $ACTUAL_SHA"

      - name: Sync tested revision to Hugging Face production
        uses: huggingface/hub-sync@v0.1.0
        with:
          github_repo_id: ${{ github.repository }}
          huggingface_repo_id: ${{ secrets.HF_PRODUCTION_SPACE }}
          hf_token: ${{ secrets.HF_TOKEN }}
          repo_type: space
          space_sdk: docker

      - name: Verify production health
        env:
          PRODUCTION_BACKEND_URL: ${{ secrets.PRODUCTION_BACKEND_URL }}
        run: |
          set -euo pipefail
          test -n "$PRODUCTION_BACKEND_URL"
          HEALTH_URL="${PRODUCTION_BACKEND_URL%/}"
          case "$HEALTH_URL" in
            */api/v1/health) ;;
            */api/v1) HEALTH_URL="${HEALTH_URL}/health" ;;
            *) HEALTH_URL="${HEALTH_URL}/api/v1/health" ;;
          esac
          curl --fail --show-error --retry 30 --retry-delay 12 --retry-all-errors "$HEALTH_URL"
