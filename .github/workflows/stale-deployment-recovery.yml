name: Dentix Stale Deployment Recovery

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]

permissions:
  contents: read

concurrency:
  group: dentix-stale-deployment-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  stale-deployment-recovery:
    name: Reproduce / Recover Stale Frontend Assets
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Reproduce Version A to Version B asset skew
        working-directory: frontend
        run: node scripts/verify-stale-deployment-recovery.mjs

      - name: Verify update accepted and update deferred contracts
        working-directory: frontend
        run: >-
          npm test --
          src/components/InstallPrompt.test.jsx
          src/pwa/preloadRecovery.test.js

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install chromium

      - name: Verify browser lifecycle stale-preload recovery matrix
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:5173
        run: >-
          npx playwright test e2e/stale-deployment-recovery.spec.ts
          --config=playwright.config.ts
          --project=chromium
          --no-deps
          --retries=0
