name: Dentix Stale Deployment Recovery

on:
  pull_request:
    branches: [main, staging]
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  push:
    branches: [main, staging]

permissions:
  contents: read

concurrency:
  group: dentix-stale-deployment-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  stale-deployment-recovery:
    name: Reproduce / Recover Stale Frontend Assets
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Fetch base branch for PR diff
        if: github.event_name == 'pull_request'
        run: git fetch --depth=50 origin ${{ github.base_ref }} || true

      - name: Classify CI Scope
        id: classify
        env:
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels) }}
        run: |
          set -euo pipefail
          python .github/scripts/classify_ci_scope.py \
            --event "${{ github.event_name }}" \
            --target-branch "${{ github.base_ref || github.ref_name }}" \
            --base-ref "origin/${{ github.base_ref || 'staging' }}" \
            --labels-json "${PR_LABELS:-[]}" \
            --output-format github-output

      - name: Skip notice when PWA / frontend assets untouched
        if: ${{ !cancelled() && steps.classify.outcome == 'success' && steps.classify.outputs.force_full == 'false' && steps.classify.outputs.pwa == 'false' && steps.classify.outputs.frontend == 'false' }}
        run: echo "PWA and frontend assets untouched; skipping stale deployment recovery safely."

      - name: Set up Node.js 20
        if: ${{ !cancelled() && (steps.classify.outcome != 'success' || steps.classify.outputs.force_full != 'false' || steps.classify.outputs.pwa == 'true' || steps.classify.outputs.frontend == 'true') }}
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        if: ${{ !cancelled() && (steps.classify.outcome != 'success' || steps.classify.outputs.force_full != 'false' || steps.classify.outputs.pwa == 'true' || steps.classify.outputs.frontend == 'true') }}
        working-directory: frontend
        run: npm ci

      - name: Reproduce Version A to Version B asset skew
        if: ${{ !cancelled() && (steps.classify.outcome != 'success' || steps.classify.outputs.force_full != 'false' || steps.classify.outputs.pwa == 'true' || steps.classify.outputs.frontend == 'true') }}
        working-directory: frontend
        run: node scripts/verify-stale-deployment-recovery.mjs

      - name: Verify update accepted and update deferred contracts
        if: ${{ !cancelled() && (steps.classify.outcome != 'success' || steps.classify.outputs.force_full != 'false' || steps.classify.outputs.pwa == 'true' || steps.classify.outputs.frontend == 'true') }}
        working-directory: frontend
        run: >-
          npm test --
          src/components/InstallPrompt.test.jsx
          src/pwa/preloadRecovery.test.js

      - name: Install Playwright Chromium
        if: ${{ !cancelled() && (steps.classify.outcome != 'success' || steps.classify.outputs.force_full != 'false' || steps.classify.outputs.pwa == 'true' || steps.classify.outputs.frontend == 'true') }}
        working-directory: frontend
        run: npx playwright install chromium

      - name: Verify browser lifecycle stale-preload recovery matrix
        if: ${{ !cancelled() && (steps.classify.outcome != 'success' || steps.classify.outputs.force_full != 'false' || steps.classify.outputs.pwa == 'true' || steps.classify.outputs.frontend == 'true') }}
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:5173
        run: >-
          npx playwright test e2e/stale-deployment-recovery.spec.ts
          --config=playwright.config.ts
          --project=chromium
          --no-deps
          --retries=0
