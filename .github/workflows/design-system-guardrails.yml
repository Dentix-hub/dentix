name: Dentix Design System Guardrails

on:
  pull_request:
    branches: [ main, staging ]
    paths:
      - 'frontend/src/**'
      - 'frontend/scripts/check-design-system-guardrails.mjs'
      - 'frontend/package.json'
      - '.github/workflows/design-system-guardrails.yml'

jobs:
  guardrails:
    name: Legacy report + new-violation gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code with base history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Report legacy design-system debt
        working-directory: frontend
        run: npm run design:guardrails

      - name: Reject newly-added guarded violations
        working-directory: frontend
        run: node scripts/check-design-system-guardrails.mjs --diff-base=origin/${{ github.base_ref }}
