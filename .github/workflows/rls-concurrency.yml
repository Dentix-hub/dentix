name: Dentix PostgreSQL RLS Concurrency Gate

on:
  push:
    branches: [ main, staging ]
  pull_request:
    branches: [ main, staging ]

concurrency:
  group: dentix-rls-concurrency-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rls-concurrency:
    name: Concurrent Tenant Isolation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: dentix_rls_concurrency
        options: >-
          --health-cmd "pg_isready -U test_user -d dentix_rls_concurrency"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.5'

      - name: Install dependencies from frozen lock
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Initialize PostgreSQL via production preflight
        env:
          DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/dentix_rls_concurrency
          DB_SSL_MODE: disable
          SECRET_KEY: rls-concurrency-secret-for-ci-only-at-least-32
          ENVIRONMENT: test
          PYTHONPATH: .
        run: python -m backend.scripts.preflight_migrations

      - name: Provision restricted NOBYPASSRLS application role
        env:
          DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/dentix_rls_concurrency
        run: |
          python - <<'PY'
          import os
          import psycopg2

          with psycopg2.connect(os.environ['DATABASE_URL']) as conn:
              conn.autocommit = True
              with conn.cursor() as cur:
                  cur.execute(
                      """
                      CREATE ROLE dentix_rls_app WITH
                          LOGIN
                          PASSWORD 'dentix_rls_app_pass'
                          NOSUPERUSER
                          NOCREATEDB
                          NOCREATEROLE
                          NOINHERIT
                          NOREPLICATION
                          NOBYPASSRLS
                      """
                  )
                  cur.execute(
                      "GRANT CONNECT ON DATABASE dentix_rls_concurrency TO dentix_rls_app"
                  )
                  cur.execute("GRANT USAGE ON SCHEMA public TO dentix_rls_app")
                  cur.execute(
                      "GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO dentix_rls_app"
                  )
                  cur.execute(
                      "GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA public TO dentix_rls_app"
                  )
          PY

      - name: Run concurrent tenant-isolation contract
        env:
          DATABASE_URL: postgresql://dentix_rls_app:dentix_rls_app_pass@localhost:5432/dentix_rls_concurrency
          DB_SSL_MODE: disable
          SECRET_KEY: rls-concurrency-secret-for-ci-only-at-least-32
          ENVIRONMENT: test
          PYTHONPATH: .
        run: |
          pytest backend/ci_tests/test_rls_concurrency_postgres.py \
            -v \
            --tb=short \
            --confcutdir=backend/ci_tests
