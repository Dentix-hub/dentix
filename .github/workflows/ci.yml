name: Dentix CI

on:
  push:
    branches: [ main, develop, staging ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: Backend Tests + Security
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: dentix_test
        options: >-
          --health-cmd "pg_isready -U test_user -d dentix_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          # python-jose installs its pure-Python ECDSA backend even though Dentix
          # uses HS256. Remove the unused vulnerable package rather than ignoring it.
          pip uninstall -y ecdsa
          pip install pytest pytest-cov bandit safety

      - name: Dependency compatibility smoke checks
        run: |
          python - <<'PY'
          import tempfile
          import chromadb
          from chromadb.utils import embedding_functions
          from jose import jwt

          secret = 'dentix-ci-smoke-secret-at-least-32'
          token = jwt.encode({'sub': 'ci'}, secret, algorithm='HS256')
          assert jwt.decode(token, secret, algorithms=['HS256'])['sub'] == 'ci'

          assert hasattr(embedding_functions, 'SentenceTransformerEmbeddingFunction')
          client = chromadb.PersistentClient(path=tempfile.mkdtemp())
          collection = client.get_or_create_collection('ci_smoke', embedding_function=None)
          collection.add(ids=['1'], embeddings=[[0.1, 0.2]], documents=['dentix'])
          result = collection.query(query_embeddings=[[0.1, 0.2]], n_results=1)
          assert result['ids'][0][0] == '1'
          assert collection.get(ids=['1'])['ids'] == ['1']
          collection.delete(ids=['1'])
          assert collection.get(ids=['1'])['ids'] == []
          PY

      - name: Initialize Database
        working-directory: .
        env:
          DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/dentix_test
          SECRET_KEY: test-secret-key-for-ci-only-at-least-32
          PYTHONPATH: .
        run: python backend/scripts/init_db.py

      - name: Run tests with coverage
        env:
          DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/dentix_test
          SECRET_KEY: test-secret-key-for-ci-only-at-least-32
          ENVIRONMENT: test
          PYTHONPATH: .
        run: |
          pytest backend/tests/ \
            --cov=backend \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=52 \
            -v \
            --tb=short \
            -x

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

      - name: Security scan — Bandit
        # Production recovery gate: fail CI on HIGH-severity findings.
        # Medium findings remain visible and should be remediated separately.
        run: |
          bandit -r backend/ \
            -lll \
            -x backend/tests,backend/scripts \
            --format txt

      - name: Dependency vulnerability check — Safety
        run: safety check --full-report

  frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Build check
        run: cd frontend && npm run build

      - name: Run frontend tests
        timeout-minutes: 5
        run: cd frontend && npm run test -- --reporter=verbose

  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci
      - run: npx playwright install chromium
      - name: Start services
        run: docker-compose -f docker-compose.test.yml up -d
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
