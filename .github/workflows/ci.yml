name: Dentix CI

on:
  push:
    branches: [ main, develop, staging ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: Backend Tests + Security
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: dentix_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.lock -r requirements.dev.txt

      - name: Initialize Database
        working-directory: .
        env:
          DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/dentix_test
          SECRET_KEY: test-secret-key-for-ci-only-at-least-32-characters
          PYTHONPATH: .
        run: python backend/scripts/init_db.py

      - name: Run tests with coverage
        env:
          DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/dentix_test
          SECRET_KEY: test-secret-key-for-ci-only-at-least-32-characters
          ENVIRONMENT: test
          PYTHONPATH: .
        run: |
          pytest backend/tests/ \
            --cov=backend \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=50 \
            -v \
            --tb=short \
            -x

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

      - name: Security scan — Bandit
        run: |
          bandit -r backend/ \
            -ll \
            -x backend/tests,backend/scripts \
            --format txt

      - name: Dependency vulnerability check — Safety
        run: pip-audit -r requirements.lock

  frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Run frontend tests
        run: cd frontend && npm run test -- --minWorkers=1 --maxWorkers=1

      - name: Lint frontend
        run: cd frontend && npm run lint

      - name: Frontend dependency vulnerability check
        run: cd frontend && npm audit --omit=dev --audit-level=high

      - name: Build check
        run: cd frontend && npm run build

  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Start services
        run: docker compose -f docker-compose.test.yml up -d --build --wait --wait-timeout 180
      - run: npx playwright test --config playwright.config.ts
        working-directory: frontend
        env:
          VITE_API_BASE_URL: http://localhost:7860
          PLAYWRIGHT_BASE_URL: http://localhost:5173
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
      - name: Stop test services
        if: always()
        run: docker compose -f docker-compose.test.yml down --volumes

  production-image:
    name: Build and publish production image
    runs-on: ubuntu-latest
    needs: [backend, frontend, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Configure BuildKit
        run: docker buildx create --name dentix-ci --driver docker-container --use

      - name: Build once and publish immutable image
        env:
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          IMAGE_REPOSITORY="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx build \
            --file Dockerfile \
            --platform linux/amd64 \
            --label "org.opencontainers.image.source=${SOURCE_URL}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --cache-from "type=registry,ref=${IMAGE_REPOSITORY}:buildcache" \
            --cache-to "type=registry,ref=${IMAGE_REPOSITORY}:buildcache,mode=max,image-manifest=true" \
            --tag "${IMAGE_REPOSITORY}:${GITHUB_SHA}" \
            --tag "${IMAGE_REPOSITORY}:main" \
            --provenance=true \
            --push \
            .
