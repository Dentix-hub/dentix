name: Dentix CI

on:
  push:
    branches: [ main, staging ]
  pull_request:
    branches: [ main, staging ]
    types: [ opened, synchronize, reopened, ready_for_review, labeled ]

concurrency:
  group: dentix-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  classify-scope:
    name: Classify CI Scope
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.classifier.outputs.backend }}
      frontend: ${{ steps.classifier.outputs.frontend }}
      mobile: ${{ steps.classifier.outputs.mobile }}
      dependencies: ${{ steps.classifier.outputs.dependencies }}
      pwa: ${{ steps.classifier.outputs.pwa }}
      container: ${{ steps.classifier.outputs.container }}
      auth: ${{ steps.classifier.outputs.auth }}
      tenancy: ${{ steps.classifier.outputs.tenancy }}
      finance: ${{ steps.classifier.outputs.finance }}
      migration: ${{ steps.classifier.outputs.migration }}
      security: ${{ steps.classifier.outputs.security }}
      clinical_semantics: ${{ steps.classifier.outputs.clinical_semantics }}
      clinical_ui: ${{ steps.classifier.outputs.clinical_ui }}
      workflow_governance: ${{ steps.classifier.outputs.workflow_governance }}
      docs_only: ${{ steps.classifier.outputs.docs_only }}
      force_full: ${{ steps.classifier.outputs.force_full }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Fetch base branch for PR diff
        if: github.event_name == 'pull_request'
        run: git fetch --depth=50 origin ${{ github.base_ref }} || true

      - name: Run Scope Classifier
        id: classifier
        env:
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels) }}
        run: |
          set -euo pipefail
          python .github/scripts/classify_ci_scope.py \
            --event "${{ github.event_name }}" \
            --target-branch "${{ github.base_ref || github.ref_name }}" \
            --base-ref "origin/${{ github.base_ref || 'staging' }}" \
            --labels-json "${PR_LABELS:-[]}" \
            --output-format github-output

  dependency-reproducibility:
    name: Frozen Dependency Reproducibility
    needs: [classify-scope]
    if: ${{ !cancelled() && (needs.classify-scope.result != 'success' || needs.classify-scope.outputs.force_full != 'false' || needs.classify-scope.outputs.dependencies == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout clean copy A
        uses: actions/checkout@v4
        with:
          path: checkout-a

      - name: Checkout clean copy B
        uses: actions/checkout@v4
        with:
          path: checkout-b

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.5'

      - name: Sync both clean checkouts from frozen lock
        shell: bash
        run: |
          set -euo pipefail
          uv sync --project checkout-a --frozen --no-dev
          uv sync --project checkout-b --frozen --no-dev
          uv tree --project checkout-a --frozen --no-dev > /tmp/deps-a.txt
          uv tree --project checkout-b --frozen --no-dev > /tmp/deps-b.txt
          diff -u /tmp/deps-a.txt /tmp/deps-b.txt

  backend:
    name: Backend Tests + Security
    needs: [classify-scope]
    if: ${{ !cancelled() && (needs.classify-scope.result != 'success' || needs.classify-scope.outputs.force_full != 'false' || needs.classify-scope.outputs.backend == 'true') }}
    runs-on: ubuntu-latest
    env:
      DB_SSL_MODE: disable

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: dentix_test
        options: >-
          --health-cmd "pg_isready -U test_user -d dentix_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.5'

      - name: Install dependencies from frozen lock
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Dependency compatibility smoke checks
        run: |
          python - <<'PY'
          import importlib.util
          import tempfile
          import chromadb
          from chromadb.utils import embedding_functions
          from jose import jwt

          assert importlib.util.find_spec('ecdsa') is None
          assert chromadb.__version__ == '0.6.3', chromadb.__version__

          secret = 'dentix-ci-smoke-secret-at-least-32'
          token = jwt.encode({'sub': 'ci'}, secret, algorithm='HS256')
          assert jwt.decode(token, secret, algorithms=['HS256'])['sub'] == 'ci'

          assert hasattr(embedding_functions, 'SentenceTransformerEmbeddingFunction')
          client = chromadb.PersistentClient(path=tempfile.mkdtemp())
          collection = client.get_or_create_collection('ci_smoke', embedding_function=None)
          collection.add(ids=['1'], embeddings=[[0.1, 0.2]], documents=['dentix'])
          result = collection.query(query_embeddings=[[0.1, 0.2]], n_results=1)
          assert result['ids'][0][0] == '1'
          assert collection.get(ids=['1'])['ids'] == ['1']
          collection.delete(ids=['1'])
          assert collection.get(ids=['1'])['ids'] == []
          PY

      - name: Ruff backend quality gate
        run: ruff check --config ruff.toml backend

      - name: Initialize Database via production Alembic preflight
        env:
          DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/dentix_test
          DB_SSL_MODE: disable
          SECRET_KEY: test-secret-key-for-ci-only-at-least-32
          PYTHONPATH: .
        run: python -m backend.scripts.preflight_migrations

      - name: Alembic model/migration drift check
        env:
          DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/dentix_test
          SECRET_KEY: test-secret-key-for-ci-only-at-least-32
          PYTHONPATH: .
        run: python -m backend.scripts.check_migration_drift

      - name: Provision restricted PostgreSQL role for RLS smoke
        env:
          DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/dentix_test
        run: |
          python - <<'PY'
          import os
          import psycopg2

          with psycopg2.connect(os.environ['DATABASE_URL']) as conn:
              conn.autocommit = True
              with conn.cursor() as cur:
                   cur.execute(
                       """
                       CREATE ROLE dentix_ci_app WITH
                          LOGIN
                          PASSWORD 'dentix_ci_app_pass'
                          NOSUPERUSER
                          NOCREATEDB
                          NOCREATEROLE
                          NOINHERIT
                          NOREPLICATION
                          NOBYPASSRLS
                       """
                   )
                   cur.execute(
                       """
                       CREATE ROLE dentix_ci_system WITH
                           LOGIN
                           PASSWORD 'dentix_ci_system_pass'
                           NOSUPERUSER
                           NOCREATEDB
                           NOCREATEROLE
                           NOINHERIT
                           NOREPLICATION
                           BYPASSRLS
                       """
                   )
                   cur.execute("GRANT CONNECT ON DATABASE dentix_test TO dentix_ci_app")
                   cur.execute("GRANT CONNECT ON DATABASE dentix_test TO dentix_ci_system")
                   cur.execute("GRANT USAGE ON SCHEMA public TO dentix_ci_app")
                   cur.execute("GRANT USAGE ON SCHEMA public TO dentix_ci_system")
                   cur.execute(
                       "GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO dentix_ci_app"
                   )
                   cur.execute(
                       "GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO dentix_ci_system"
                   )
                   cur.execute(
                       "GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA public TO dentix_ci_app"
                   )
                   cur.execute(
                       "GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA public TO dentix_ci_system"
                   )
          PY

      - name: Finance and RLS PostgreSQL smoke
        env:
          APP_DATABASE_URL_PREFIX: postgresql://dentix_ci_app
          APP_DATABASE_URL_SUFFIX: :dentix_ci_app_pass@localhost:5432/dentix_test
          SYSTEM_DATABASE_URL_PREFIX: postgresql://dentix_ci_system
          SYSTEM_DATABASE_URL_SUFFIX: :dentix_ci_system_pass@localhost:5432/dentix_test
          DB_SSL_MODE: disable
          SECRET_KEY: test-secret-key-for-ci-only-at-least-32
          ENVIRONMENT: test
          PYTHONPATH: .
        run: |
          export DATABASE_URL="${APP_DATABASE_URL_PREFIX}${APP_DATABASE_URL_SUFFIX}"
          export SYSTEM_DATABASE_URL="${SYSTEM_DATABASE_URL_PREFIX}${SYSTEM_DATABASE_URL_SUFFIX}"
          python -c "import asyncio; from backend.database import verify_system_database_role; asyncio.run(verify_system_database_role())"
          pytest backend/ci_tests/test_finance_postgres_smoke.py \
            -v \
            --tb=short \
            --confcutdir=backend/ci_tests
          pytest backend/ci_tests/test_auth_bootstrap_rls_probe.py \
            backend/ci_tests/test_auth_cookie_flow_http.py \
            backend/ci_tests/test_child_tenant_rls_postgres.py \
            backend/ci_tests/test_cross_tenant_http_postgres.py \
            backend/ci_tests/test_upload_postgres_smoke.py \
            -v \
            --tb=short \
            --confcutdir=backend/ci_tests

      - name: Run tests with coverage
        env:
          DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/dentix_test
          SECRET_KEY: test-secret-key-for-ci-only-at-least-32
          ENVIRONMENT: test
          PYTHONPATH: .
        run: |
          pytest backend/tests/ \
            --cov=backend \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=52 \
            -v \
            --tb=short \
            --maxfail=0

      - name: Upload coverage report
        if: always()
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

      - name: Security scan — Bandit
        run: |
          bandit -r backend/ \
            -lll \
            -x backend/tests,backend/scripts \
            --format txt

      - name: Dependency vulnerability check — Safety
        # Retry only Safety's exact feed-mismatch KeyError; every other non-zero exit remains fail-closed.
        run: python .github/scripts/run_safety_check.py

  frontend:
    name: Frontend Tests
    needs: [classify-scope]
    if: ${{ !cancelled() && (needs.classify-scope.result != 'success' || needs.classify-scope.outputs.force_full != 'false' || needs.classify-scope.outputs.frontend == 'true') }}
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - name: Checkout code with base history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Report legacy design-system debt
        working-directory: frontend
        run: npm run design:guardrails

      - name: Reject newly-added guarded violations
        if: github.event_name == 'pull_request'
        working-directory: frontend
        run: node scripts/check-design-system-guardrails.mjs --diff-base=origin/${{ github.base_ref }}

      - name: Run frontend lint
        run: cd frontend && npm run lint

      - name: Build check
        run: cd frontend && npm run build

      - name: PWA artifact baseline
        working-directory: frontend
        run: node scripts/pwa-artifact-report.mjs dist

      - name: Upload PWA baseline report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pwa-baseline
          path: frontend/dist/pwa-baseline.json
          if-no-files-found: ignore

      - name: Run frontend tests
        timeout-minutes: 8
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t test_files < <(find src -type f \( -name '*.test.js' -o -name '*.test.jsx' -o -name '*.test.ts' -o -name '*.test.tsx' \) | sort)

          if [ "${#test_files[@]}" -eq 0 ]; then
            echo "No frontend test files found."
            exit 1
          fi

          echo "Found ${#test_files[@]} frontend test files."
          for test_file in "${test_files[@]}"; do
            echo "::group::Vitest ${test_file}"
            timeout --signal=SIGTERM --kill-after=5s 45s \
              npx vitest run "${test_file}" --reporter=verbose
            echo "::endgroup::"
          done

  rls-concurrency:
    name: Concurrent Tenant Isolation
    needs: [classify-scope]
    if: ${{ !cancelled() && (needs.classify-scope.result != 'success' || needs.classify-scope.outputs.force_full != 'false' || needs.classify-scope.outputs.tenancy == 'true' || needs.classify-scope.outputs.auth == 'true' || needs.classify-scope.outputs.security == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: dentix_rls_concurrency
        options: >-
          --health-cmd "pg_isready -U test_user -d dentix_rls_concurrency"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.5'

      - name: Install dependencies from frozen lock
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Initialize PostgreSQL via production preflight
        env:
          DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/dentix_rls_concurrency
          DB_SSL_MODE: disable
          SECRET_KEY: rls-concurrency-secret-for-ci-only-at-least-32
          ENVIRONMENT: test
          PYTHONPATH: .
        run: python -m backend.scripts.preflight_migrations

      - name: Provision restricted NOBYPASSRLS application role
        env:
          DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/dentix_rls_concurrency
        run: |
          python - <<'PY'
          import os
          import psycopg2

          with psycopg2.connect(os.environ['DATABASE_URL']) as conn:
              conn.autocommit = True
              with conn.cursor() as cur:
                  cur.execute(
                      """
                      CREATE ROLE dentix_rls_app WITH
                          LOGIN
                          PASSWORD 'dentix_rls_app_pass'
                          NOSUPERUSER
                          NOCREATEDB
                          NOCREATEROLE
                          NOINHERIT
                          NOREPLICATION
                          NOBYPASSRLS
                      """
                  )
                  cur.execute(
                      """
                      CREATE ROLE dentix_rls_system WITH
                          LOGIN
                          PASSWORD 'dentix_rls_system_pass'
                          NOSUPERUSER
                          NOCREATEDB
                          NOCREATEROLE
                          NOINHERIT
                          NOREPLICATION
                          BYPASSRLS
                      """
                  )
                  cur.execute(
                      "GRANT CONNECT ON DATABASE dentix_rls_concurrency TO dentix_rls_app"
                  )
                  cur.execute(
                      "GRANT CONNECT ON DATABASE dentix_rls_concurrency TO dentix_rls_system"
                  )
                  cur.execute("GRANT USAGE ON SCHEMA public TO dentix_rls_app")
                  cur.execute("GRANT USAGE ON SCHEMA public TO dentix_rls_system")
                  cur.execute(
                      "GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO dentix_rls_app"
                  )
                  cur.execute(
                      "GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO dentix_rls_system"
                  )
                  cur.execute(
                      "GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA public TO dentix_rls_app"
                  )
                  cur.execute(
                      "GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA public TO dentix_rls_system"
                  )
          PY

      - name: Run concurrent tenant-isolation contract
        env:
          APP_DATABASE_URL_PREFIX: postgresql://dentix_rls_app
          APP_DATABASE_URL_SUFFIX: :dentix_rls_app_pass@localhost:5432/dentix_rls_concurrency
          SYSTEM_DATABASE_URL_PREFIX: postgresql://dentix_rls_system
          SYSTEM_DATABASE_URL_SUFFIX: :dentix_rls_system_pass@localhost:5432/dentix_rls_concurrency
          DB_SSL_MODE: disable
          SECRET_KEY: rls-concurrency-secret-for-ci-only-at-least-32
          ENVIRONMENT: test
          PYTHONPATH: .
        run: |
          export DATABASE_URL="${APP_DATABASE_URL_PREFIX}${APP_DATABASE_URL_SUFFIX}"
          export SYSTEM_DATABASE_URL="${SYSTEM_DATABASE_URL_PREFIX}${SYSTEM_DATABASE_URL_SUFFIX}"
          pytest backend/ci_tests/test_rls_concurrency_postgres.py \
            -v \
            --tb=short \
            --confcutdir=backend/ci_tests

  stale-deployment-recovery:
    name: Reproduce / Recover Stale Frontend Assets
    needs: [classify-scope]
    if: ${{ !cancelled() && (needs.classify-scope.result != 'success' || needs.classify-scope.outputs.force_full != 'false' || needs.classify-scope.outputs.pwa == 'true' || needs.classify-scope.outputs.frontend == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Reproduce Version A to Version B asset skew
        working-directory: frontend
        run: node scripts/verify-stale-deployment-recovery.mjs

      - name: Verify update accepted and update deferred contracts
        working-directory: frontend
        run: >-
          npm test --
          src/components/InstallPrompt.test.jsx
          src/pwa/preloadRecovery.test.js

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install chromium

      - name: Verify browser lifecycle stale-preload recovery matrix
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:5173
        run: >-
          npx playwright test e2e/stale-deployment-recovery.spec.ts
          --config=playwright.config.ts
          --project=chromium
          --no-deps
          --retries=0

  responsive:
    name: Responsive Acceptance Matrix
    needs: [classify-scope]
    if: ${{ !cancelled() && (needs.classify-scope.result != 'success' || needs.classify-scope.outputs.force_full != 'false' || needs.classify-scope.outputs.frontend == 'true' || needs.classify-scope.outputs.clinical_ui == 'true' || needs.classify-scope.outputs.mobile == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: mobile_user
          POSTGRES_PASSWORD: mobile_pass
          POSTGRES_DB: dentix_mobile
        options: >-
          --health-cmd "pg_isready -U mobile_user -d dentix_mobile"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://mobile_user:mobile_pass@localhost:5432/dentix_mobile
      DB_SSL_MODE: disable
      SECRET_KEY: mobile-responsive-ci-secret-at-least-32
      ENVIRONMENT: test
      PYTHONPATH: .
      ENABLE_IN_PROCESS_WORKERS: 'false'
      FRONTEND_URL: http://localhost:5173
      CORS_ORIGINS: http://localhost:5173
      VITE_API_URL: http://localhost:8000/api/v1
      VITE_API_BASE_URL: http://localhost:8000
      PLAYWRIGHT_BASE_URL: http://localhost:5173

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.5'

      - name: Install backend dependencies from frozen lock
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --no-dev
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Initialize responsive-test database
        run: python -m backend.scripts.preflight_migrations

      - name: Provision isolated responsive-test database roles
        shell: bash
        run: |
          python - <<'PY'
          import os
          import psycopg2

          with psycopg2.connect(os.environ["DATABASE_URL"]) as conn:
              conn.autocommit = True
              with conn.cursor() as cur:
                  cur.execute("CREATE ROLE dentix_mobile_app LOGIN PASSWORD 'dentix_mobile_app_pass' NOBYPASSRLS")
                  cur.execute("CREATE ROLE dentix_mobile_system LOGIN PASSWORD 'dentix_mobile_system_pass' BYPASSRLS")
                  for role in ("dentix_mobile_app", "dentix_mobile_system"):
                      cur.execute(f"GRANT CONNECT ON DATABASE dentix_mobile TO {role}")
                      cur.execute(f"GRANT USAGE ON SCHEMA public TO {role}")
                      cur.execute(f"GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO {role}")
                      cur.execute(f"GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA public TO {role}")
          PY
          APP_DATABASE_URL_PREFIX='postgresql://dentix_mobile_app'
          APP_DATABASE_URL_SUFFIX=':dentix_mobile_app_pass@localhost:5432/dentix_mobile'
          SYSTEM_DATABASE_URL_PREFIX='postgresql://dentix_mobile_system'
          SYSTEM_DATABASE_URL_SUFFIX=':dentix_mobile_system_pass@localhost:5432/dentix_mobile'
          echo "DATABASE_URL=${APP_DATABASE_URL_PREFIX}${APP_DATABASE_URL_SUFFIX}" >> "$GITHUB_ENV"
          echo "SYSTEM_DATABASE_URL=${SYSTEM_DATABASE_URL_PREFIX}${SYSTEM_DATABASE_URL_SUFFIX}" >> "$GITHUB_ENV"

      - name: Start backend
        shell: bash
        run: |
          set -euo pipefail
          nohup uvicorn backend.main:app --host 127.0.0.1 --port 8000 > /tmp/dentix-mobile-backend.log 2>&1 &
          echo $! > /tmp/dentix-mobile-backend.pid

          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:8000/api/v1/health > /dev/null; then
              echo "Backend is ready."
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/dentix-mobile-backend.pid)" 2>/dev/null; then
              echo "Backend exited before becoming ready."
              cat /tmp/dentix-mobile-backend.log
              exit 1
            fi
            sleep 2
          done

          echo "Backend did not become ready in time."
          cat /tmp/dentix-mobile-backend.log
          exit 1

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build recovered frontend
        working-directory: frontend
        run: npm run build

      - name: Date/time responsive unit regression
        working-directory: frontend
        run: npx vitest run src/shared/ui/DateTimePicker.test.jsx --reporter=verbose

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install chromium

      - name: Prepare isolated responsive-test data
        working-directory: frontend
        run: npx playwright test e2e/setup.spec.ts --config=playwright.config.ts --project=setup --retries=0

      - name: Run 320 / Arabic / English / tablet matrix
        working-directory: frontend
        run: >-
          npx playwright test e2e/mobile-responsive.spec.ts
          --config=playwright.config.ts
          --project=mobile-compact-320
          --project=mobile-ar
          --project=mobile-en
          --project=tablet
          --no-deps
          --retries=0

      - name: Show backend log on failure
        if: failure()
        run: cat /tmp/dentix-mobile-backend.log || true

      - name: Upload Playwright responsive artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-responsive-playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/

  e2e:
    name: E2E Critical Path (Playwright)
    needs: [classify-scope, backend, frontend, dependency-reproducibility]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && (needs.classify-scope.result != 'success' || needs.classify-scope.outputs.force_full != 'false' || ((needs.classify-scope.outputs.frontend == 'true' && needs.classify-scope.outputs.backend == 'true') || needs.classify-scope.outputs.auth == 'true' || needs.classify-scope.outputs.clinical_ui == 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: e2e_user
          POSTGRES_PASSWORD: e2e_pass
          POSTGRES_DB: dentix_e2e
        options: >-
          --health-cmd "pg_isready -U e2e_user -d dentix_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://e2e_user:e2e_pass@localhost:5432/dentix_e2e
      DB_SSL_MODE: disable
      SECRET_KEY: e2e-secret-key-for-ci-only-at-least-32
      ENVIRONMENT: test
      PYTHONPATH: .
      ENABLE_IN_PROCESS_WORKERS: 'false'
      FRONTEND_URL: http://localhost:5173
      CORS_ORIGINS: http://localhost:5173
      VITE_API_URL: http://localhost:8000/api/v1
      VITE_API_BASE_URL: http://localhost:8000
      PLAYWRIGHT_BASE_URL: http://localhost:5173

    steps:
      - name: Checkout code with visual baselines
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.5'

      - name: Install backend dependencies from frozen lock
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --no-dev
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Initialize E2E database via production Alembic preflight
        run: python -m backend.scripts.preflight_migrations

      - name: Provision isolated E2E database roles
        shell: bash
        run: |
          python - <<'PY'
          import os
          import psycopg2

          with psycopg2.connect(os.environ["DATABASE_URL"]) as conn:
              conn.autocommit = True
              with conn.cursor() as cur:
                  cur.execute("CREATE ROLE dentix_e2e_app LOGIN PASSWORD 'dentix_e2e_app_pass' NOBYPASSRLS")
                  cur.execute("CREATE ROLE dentix_e2e_system LOGIN PASSWORD 'dentix_e2e_system_pass' BYPASSRLS")
                  for role in ("dentix_e2e_app", "dentix_e2e_system"):
                      cur.execute(f"GRANT CONNECT ON DATABASE dentix_e2e TO {role}")
                      cur.execute(f"GRANT USAGE ON SCHEMA public TO {role}")
                      cur.execute(f"GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO {role}")
                      cur.execute(f"GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA public TO {role}")
          PY
          APP_DATABASE_URL_PREFIX='postgresql://dentix_e2e_app'
          APP_DATABASE_URL_SUFFIX=':dentix_e2e_app_pass@localhost:5432/dentix_e2e'
          SYSTEM_DATABASE_URL_PREFIX='postgresql://dentix_e2e_system'
          SYSTEM_DATABASE_URL_SUFFIX=':dentix_e2e_system_pass@localhost:5432/dentix_e2e'
          echo "DATABASE_URL=${APP_DATABASE_URL_PREFIX}${APP_DATABASE_URL_SUFFIX}" >> "$GITHUB_ENV"
          echo "SYSTEM_DATABASE_URL=${SYSTEM_DATABASE_URL_PREFIX}${SYSTEM_DATABASE_URL_SUFFIX}" >> "$GITHUB_ENV"

      - name: Start backend
        shell: bash
        run: |
          set -euo pipefail
          nohup uvicorn backend.main:app --host 127.0.0.1 --port 8000 > /tmp/dentix-e2e-backend.log 2>&1 &
          echo $! > /tmp/dentix-e2e-backend.pid

          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:8000/api/v1/health > /dev/null; then
              echo "Backend is ready."
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/dentix-e2e-backend.pid)" 2>/dev/null; then
              echo "Backend exited before becoming ready."
              cat /tmp/dentix-e2e-backend.log
              exit 1
            fi
            sleep 2
          done

          echo "Backend did not become ready in time."
          cat /tmp/dentix-e2e-backend.log
          exit 1

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install chromium

      - name: Prepare isolated E2E data
        working-directory: frontend
        run: npx playwright test e2e/setup.spec.ts --config=playwright.config.ts --project=setup --retries=0

      - name: Run production critical path
        working-directory: frontend
        run: npx playwright test e2e/critical-path.spec.ts --config=playwright.config.ts --project=chromium --no-deps --max-failures=1 --retries=0

      - name: Run UI visual regression
        working-directory: frontend
        run: npx playwright test e2e/ui-regression.spec.ts --config=playwright.config.ts --project=visual-desktop --project=visual-mobile --no-deps --retries=0

      - name: Show backend log on failure
        if: failure()
        run: cat /tmp/dentix-e2e-backend.log || true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/

  production-container:
    name: Validate Production Container
    needs: [classify-scope, backend, frontend, e2e, dependency-reproducibility]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && (needs.classify-scope.result != 'success' || needs.classify-scope.outputs.force_full != 'false' || needs.classify-scope.outputs.container == 'true' || needs.classify-scope.outputs.dependencies == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: container_user
          POSTGRES_PASSWORD: container_pass
          POSTGRES_DB: dentix_container
        options: >-
          --health-cmd "pg_isready -U container_user -d dentix_container"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v4

      - name: Configure BuildKit
        run: docker buildx create --name dentix-ci --driver docker-container --use

      - name: Build production image
        env:
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          docker buildx build \
            --file Dockerfile \
            --platform linux/amd64 \
            --label "org.opencontainers.image.source=${SOURCE_URL}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "dentix-ci:${GITHUB_SHA}" \
            --load \
            .
          IMAGE_REVISION="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "dentix-ci:${GITHUB_SHA}")"
          test "$IMAGE_REVISION" = "$GITHUB_SHA"

      - name: Run canonical image as non-root and verify startup contract
        env:
          APP_DATABASE_URL_PREFIX: postgresql://dentix_container_app
          APP_DATABASE_URL_SUFFIX: :dentix_container_app_pass@127.0.0.1:5432/dentix_container
          SYSTEM_DATABASE_URL_PREFIX: postgresql://dentix_container_system
          SYSTEM_DATABASE_URL_SUFFIX: :dentix_container_system_pass@127.0.0.1:5432/dentix_container
          SECRET_KEY: container-smoke-secret-key-for-ci-at-least-32
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="dentix-ci:${GITHUB_SHA}"
          DATABASE_URL="${APP_DATABASE_URL_PREFIX}${APP_DATABASE_URL_SUFFIX}"
          SYSTEM_DATABASE_URL="${SYSTEM_DATABASE_URL_PREFIX}${SYSTEM_DATABASE_URL_SUFFIX}"
          OWNER_DATABASE_URL_PREFIX='postgresql://container_user'
          OWNER_DATABASE_URL_SUFFIX=':container_pass@127.0.0.1:5432/dentix_container'
          OWNER_DATABASE_URL="${OWNER_DATABASE_URL_PREFIX}${OWNER_DATABASE_URL_SUFFIX}"

          test "$(docker image inspect --format '{{.Config.User}}' "$IMAGE")" = "dentix"

          docker run --rm \
            --network host \
            --entrypoint python \
            -e DATABASE_URL="$OWNER_DATABASE_URL" \
            -e DB_SSL_MODE=disable \
            -e SECRET_KEY="$SECRET_KEY" \
            -e ENVIRONMENT=production \
            "$IMAGE" \
            -m backend.scripts.preflight_migrations

          PGPASSWORD=container_pass psql --host=127.0.0.1 --username=container_user --dbname=dentix_container <<'SQL'
          CREATE ROLE dentix_container_app LOGIN PASSWORD 'dentix_container_app_pass' NOBYPASSRLS;
          CREATE ROLE dentix_container_system LOGIN PASSWORD 'dentix_container_system_pass' BYPASSRLS;
          GRANT CONNECT ON DATABASE dentix_container TO dentix_container_app, dentix_container_system;
          GRANT USAGE ON SCHEMA public TO dentix_container_app, dentix_container_system;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO dentix_container_app, dentix_container_system;
          GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA public TO dentix_container_app, dentix_container_system;
          SQL

          docker run --detach \
            --name dentix-runtime-smoke \
            --network host \
            -e DATABASE_URL="$DATABASE_URL" \
            -e SYSTEM_DATABASE_URL="$SYSTEM_DATABASE_URL" \
            -e DB_SSL_MODE=disable \
            -e SECRET_KEY="$SECRET_KEY" \
            -e ENVIRONMENT=production \
            -e ENABLE_IN_PROCESS_WORKERS=false \
            "$IMAGE"

          cleanup() {
            docker logs dentix-runtime-smoke || true
            docker rm --force dentix-runtime-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          ready=false
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:7860/api/v1/health >/tmp/dentix-container-health.json; then
              ready=true
              break
            fi

            state="$(docker inspect --format '{{.State.Status}}' dentix-runtime-smoke)"
            if [ "$state" = "exited" ] || [ "$state" = "dead" ]; then
              echo "Production container exited before health became ready."
              exit 1
            fi
            sleep 2
          done

          test "$ready" = "true"
          cat /tmp/dentix-container-health.json

          test "$(docker exec dentix-runtime-smoke id -u)" = "1000"
          test "$(docker exec dentix-runtime-smoke id -un)" = "dentix"

          docker exec dentix-runtime-smoke sh -ec 'touch /app/uploads/.ci-write && rm /app/uploads/.ci-write'
          docker exec dentix-runtime-smoke sh -ec 'touch /app/rag_storage/.ci-write && rm /app/rag_storage/.ci-write'

          if docker exec dentix-runtime-smoke sh -ec 'touch /app/backend/.ci-must-not-write'; then
            echo "Runtime user unexpectedly wrote into the root-owned source tree."
            exit 1
          fi
