name: Dentix CI

on:
  push:
    branches: [ main, develop, staging ]
  pull_request:
    branches: [ main, staging ]

concurrency:
  group: dentix-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Tests + Security
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: dentix_test
        options: >-
          --health-cmd "pg_isready -U test_user -d dentix_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip uninstall -y ecdsa
          pip install pytest pytest-cov bandit safety

      - name: Dependency compatibility smoke checks
        run: |
          python - <<'PY'
          import tempfile
          import chromadb
          from chromadb.utils import embedding_functions
          from jose import jwt

          secret = 'dentix-ci-smoke-secret-at-least-32'
          token = jwt.encode({'sub': 'ci'}, secret, algorithm='HS256')
          assert jwt.decode(token, secret, algorithms=['HS256'])['sub'] == 'ci'

          assert hasattr(embedding_functions, 'SentenceTransformerEmbeddingFunction')
          client = chromadb.PersistentClient(path=tempfile.mkdtemp())
          collection = client.get_or_create_collection('ci_smoke', embedding_function=None)
          collection.add(ids=['1'], embeddings=[[0.1, 0.2]], documents=['dentix'])
          result = collection.query(query_embeddings=[[0.1, 0.2]], n_results=1)
          assert result['ids'][0][0] == '1'
          assert collection.get(ids=['1'])['ids'] == ['1']
          collection.delete(ids=['1'])
          assert collection.get(ids=['1'])['ids'] == []
          PY

      - name: Initialize Database via production Alembic preflight
        env:
          DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/dentix_test
          DB_SSL_MODE: disable
          SECRET_KEY: test-secret-key-for-ci-only-at-least-32
          PYTHONPATH: .
        run: python -m backend.scripts.preflight_migrations

      - name: Provision restricted PostgreSQL role for RLS smoke
        env:
          DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/dentix_test
        run: |
          python - <<'PY'
          import os
          import psycopg2

          with psycopg2.connect(os.environ['DATABASE_URL']) as conn:
              conn.autocommit = True
              with conn.cursor() as cur:
                  cur.execute(
                      """
                      CREATE ROLE dentix_ci_app WITH
                          LOGIN
                          PASSWORD 'dentix_ci_app_pass'
                          NOSUPERUSER
                          NOCREATEDB
                          NOCREATEROLE
                          NOINHERIT
                          NOREPLICATION
                          NOBYPASSRLS
                      """
                  )
                  cur.execute("GRANT CONNECT ON DATABASE dentix_test TO dentix_ci_app")
                  cur.execute("GRANT USAGE ON SCHEMA public TO dentix_ci_app")
                  cur.execute(
                      "GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO dentix_ci_app"
                  )
                  cur.execute(
                      "GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA public TO dentix_ci_app"
                  )
          PY

      - name: Finance PostgreSQL smoke
        env:
          DATABASE_URL: postgresql://dentix_ci_app:dentix_ci_app_pass@localhost:5432/dentix_test
          DB_SSL_MODE: disable
          SECRET_KEY: test-secret-key-for-ci-only-at-least-32
          ENVIRONMENT: test
          PYTHONPATH: .
        run: |
          pytest backend/ci_tests/test_finance_postgres_smoke.py \
            -v \
            --tb=short \
            --confcutdir=backend/ci_tests

      - name: Run tests with coverage
        env:
          DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/dentix_test
          SECRET_KEY: test-secret-key-for-ci-only-at-least-32
          ENVIRONMENT: test
          PYTHONPATH: .
        run: |
          pytest backend/tests/ \
            --cov=backend \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=52 \
            -v \
            --tb=short \
            --maxfail=0

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

      - name: Security scan — Bandit
        run: |
          bandit -r backend/ \
            -lll \
            -x backend/tests,backend/scripts \
            --format txt

      - name: Dependency vulnerability check — Safety
        run: safety check --full-report

  frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Build check
        run: cd frontend && npm run build

      - name: Lint
        run: cd frontend && npm run lint

      - name: Design-system guardrails
        run: cd frontend && npm run design:guardrails

      - name: Run frontend tests
        timeout-minutes: 8
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t test_files < <(find src -type f \( -name '*.test.js' -o -name '*.test.jsx' -o -name '*.test.ts' -o -name '*.test.tsx' \) | sort)

          if [ "${#test_files[@]}" -eq 0 ]; then
            echo "No frontend test files found."
            exit 1
          fi

          echo "Found ${#test_files[@]} frontend test files."
          for test_file in "${test_files[@]}"; do
            echo "::group::Vitest ${test_file}"
            timeout --signal=SIGTERM --kill-after=5s 45s \
              npx vitest run "${test_file}" --reporter=verbose
            echo "::endgroup::"
          done

  e2e:
    name: E2E Critical Path (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: e2e_user
          POSTGRES_PASSWORD: e2e_pass
          POSTGRES_DB: dentix_e2e
        options: >-
          --health-cmd "pg_isready -U e2e_user -d dentix_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://e2e_user:e2e_pass@localhost:5432/dentix_e2e
      SECRET_KEY: e2e-secret-key-for-ci-only-at-least-32
      ENVIRONMENT: test
      PYTHONPATH: .
      ENABLE_IN_PROCESS_WORKERS: 'false'
      FRONTEND_URL: http://localhost:5173
      CORS_ORIGINS: http://localhost:5173
      VITE_API_URL: http://localhost:8000/api/v1
      VITE_API_BASE_URL: http://localhost:8000
      PLAYWRIGHT_BASE_URL: http://localhost:5173

    steps:
      - name: Checkout code with visual baselines
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install backend dependencies
        run: |
          pip install -r requirements.txt
          pip uninstall -y ecdsa

      - name: Initialize E2E database via production Alembic preflight
        run: python -m backend.scripts.preflight_migrations

      - name: Start backend
        shell: bash
        run: |
          set -euo pipefail
          nohup uvicorn backend.main:app --host 127.0.0.1 --port 8000 > /tmp/dentix-e2e-backend.log 2>&1 &
          echo $! > /tmp/dentix-e2e-backend.pid

          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:8000/api/v1/health > /dev/null; then
              echo "Backend is ready."
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/dentix-e2e-backend.pid)" 2>/dev/null; then
              echo "Backend exited before becoming ready."
              cat /tmp/dentix-e2e-backend.log
              exit 1
            fi
            sleep 2
          done

          echo "Backend did not become ready in time."
          cat /tmp/dentix-e2e-backend.log
          exit 1

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install chromium

      - name: Prepare isolated E2E data
        working-directory: frontend
        run: npx playwright test e2e/setup.spec.ts --config=playwright.config.ts --project=setup --retries=0

      - name: Run production critical path
        working-directory: frontend
        run: npx playwright test e2e/critical-path.spec.ts --config=playwright.config.ts --project=chromium --no-deps --max-failures=1 --retries=0

      - name: Run UI visual regression
        working-directory: frontend
        run: npx playwright test e2e/ui-regression.spec.ts --config=playwright.config.ts --project=visual-desktop --project=visual-mobile --no-deps --retries=0

      - name: Run responsive mobile acceptance matrix
        working-directory: frontend
        run: >-
          npx playwright test e2e/mobile-responsive.spec.ts
          --config=playwright.config.ts
          --project=mobile-compact-320
          --project=mobile-ar
          --project=mobile-en
          --project=tablet
          --no-deps
          --retries=0

      - name: Show backend log on failure
        if: failure()
        run: cat /tmp/dentix-e2e-backend.log || true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/

  production-container:
    name: Validate / Publish Production Container
    runs-on: ubuntu-latest
    needs: [backend, frontend, e2e]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v4

      - name: Validate production Compose
        shell: bash
        run: |
          set -euo pipefail
          touch .env
          DENTIX_IMAGE="dentix-ci:${GITHUB_SHA}" \
            docker compose -f docker-compose.production.yml config --quiet

      - name: Configure BuildKit
        run: docker buildx create --name dentix-ci --driver docker-container --use

      - name: Build production image on pull requests
        if: github.event_name == 'pull_request'
        env:
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          docker buildx build \
            --file Dockerfile \
            --platform linux/amd64 \
            --label "org.opencontainers.image.source=${SOURCE_URL}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "dentix-ci:${GITHUB_SHA}" \
            --load \
            .
          IMAGE_REVISION="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "dentix-ci:${GITHUB_SHA}")"
          test "$IMAGE_REVISION" = "$GITHUB_SHA"

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Publish immutable production image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          IMAGE_REPOSITORY="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx build \
            --file Dockerfile \
            --platform linux/amd64 \
            --label "org.opencontainers.image.source=${SOURCE_URL}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "${IMAGE_REPOSITORY}:${GITHUB_SHA}" \
            --tag "${IMAGE_REPOSITORY}:main" \
            --provenance=true \
            --push \
            .
