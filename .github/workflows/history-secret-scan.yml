name: Dentix History Secret Scan

on:
  pull_request:
    branches: [main, staging]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dentix-history-secret-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  history-secret-scan:
    name: Full Git History Secret Scan
    if: ${{ github.event_name == 'workflow_dispatch' || !(github.base_ref == 'main' && (github.head_ref == 'staging' || startsWith(github.head_ref, 'release/promotion-'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base branch for PR commit range
        if: github.event_name == 'pull_request'
        run: git fetch origin ${{ github.base_ref }} || true

      - name: Pull pinned Gitleaks scanner
        shell: bash
        run: |
          set -euo pipefail
          GITLEAKS_IMAGE="ghcr.io/gitleaks/gitleaks@sha256:75bdb2b2f4db213cde0b8295f13a88d6b333091bbfbf3012a4e083d00d31caba"
          docker pull "$GITLEAKS_IMAGE"
          echo "GITLEAKS_IMAGE=$GITLEAKS_IMAGE" >> "$GITHUB_ENV"

      - name: Self-test scanner against a history-only leak
        shell: bash
        run: |
          set -euo pipefail
          SELFTEST="$(mktemp -d)"
          trap 'rm -rf "$SELFTEST"' EXIT

          git -C "$SELFTEST" init --quiet
          git -C "$SELFTEST" config user.name "Dentix CI"
          git -C "$SELFTEST" config user.email "dentix-ci@example.invalid"

          # Assemble the synthetic token at runtime so this workflow file itself
          # never contains a literal rule-matching GitHub PAT.
          printf 'token = "ghp_%s%s"\n' \
            'aBcDeFgHiJkLmNoPqRsTuVwXyZ' \
            '0123456789' > "$SELFTEST/history-only-secret.txt"
          git -C "$SELFTEST" add history-only-secret.txt
          git -C "$SELFTEST" commit --quiet -m "self-test: add synthetic secret"
          rm "$SELFTEST/history-only-secret.txt"
          git -C "$SELFTEST" add -u
          git -C "$SELFTEST" commit --quiet -m "self-test: remove synthetic secret"

          test ! -e "$SELFTEST/history-only-secret.txt"

          set +e
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$SELFTEST:/repo:ro" \
            "$GITLEAKS_IMAGE" \
            detect --source=/repo --log-opts="--all" --redact --no-banner
          STATUS=$?
          set -e

          if [ "$STATUS" -ne 1 ]; then
            echo "Gitleaks self-test failed: expected exit 1 for a secret present only in git history, got $STATUS."
            exit 1
          fi
          echo "Gitleaks self-test passed: history-only synthetic secret was detected."

      - name: Scan PR commit range
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          BASE_REF="origin/${{ github.base_ref }}"
          echo "Scanning PR commit range: ${BASE_REF}...HEAD"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            "$GITLEAKS_IMAGE" \
            detect --source=/repo --log-opts="${BASE_REF}...HEAD" --redact --no-banner --verbose

      - name: Scan full git history (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          echo "Scanning complete repository git history"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            "$GITLEAKS_IMAGE" \
            detect --source=/repo --log-opts="--all" --redact --no-banner --verbose
