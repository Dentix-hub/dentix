# =============================================================
# Dentix LOCAL DEVELOPMENT Environment
# Mirrors production stack: FastAPI + Redis + Prefect Workers
# Missing from prod: Caddy (no SSL locally), Datadog, OpenWA
#
# Usage:
#   docker compose -f docker-compose.dev.yml up --build
#   Frontend: http://localhost:5173 (Vite HMR)
#   Backend:  http://localhost:7860 (FastAPI)
# =============================================================

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.do
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:local-dev-password@db:5432/dentix_dev}
      - DB_SSL_MODE=${DB_SSL_MODE:-disable}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-not-for-production}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - ENVIRONMENT=development
      - ENABLE_IN_PROCESS_WORKERS=false
      - LOG_LEVEL=DEBUG
      - FRONTEND_URL=http://localhost:${FRONTEND_PORT:-5173}
      - CORS_ORIGINS=http://localhost:${FRONTEND_PORT:-5173},http://localhost:${BACKEND_PORT:-7860}
      - BACKEND_PUBLIC_URL=http://localhost:${BACKEND_PORT:-7860}
    ports:
      - "${BACKEND_PORT:-7860}:7860"
    volumes:
      - ./backend:/app/backend
      - ./uploads:/app/backend/uploads
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_healthy

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    environment:
      - VITE_API_BASE_URL=http://localhost:${BACKEND_PORT:-7860}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

  worker:
    build:
      context: .
      dockerfile: Dockerfile.do
    command: ["python", "-m", "backend.workers.prefect_worker"]
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:local-dev-password@db:5432/dentix_dev}
      - DB_SSL_MODE=${DB_SSL_MODE:-disable}
      - REDIS_URL=redis://redis:6379/0
      - GROQ_API_KEY=${GROQ_API_KEY}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-not-for-production}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - ENVIRONMENT=development
    volumes:
      - ./backend:/app/backend
      - ./uploads:/app/backend/uploads
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_healthy

  domain-worker:
    build:
      context: .
      dockerfile: Dockerfile.do
    command: ["python", "-m", "backend.workers.run", "--workers", "all"]
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:local-dev-password@db:5432/dentix_dev}
      - DB_SSL_MODE=${DB_SSL_MODE:-disable}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-not-for-production}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - ENVIRONMENT=development
      - LOG_LEVEL=DEBUG
      - DENTIX_WORKERS=all
      - EVENT_WORKER_POLL_INTERVAL_SECONDS=${EVENT_WORKER_POLL_INTERVAL_SECONDS:-5}
      - SUBSCRIPTION_CHECK_INTERVAL_HOURS=${SUBSCRIPTION_CHECK_INTERVAL_HOURS:-12}
    volumes:
      - ./backend:/app/backend
      - ./uploads:/app/backend/uploads
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_started
      db:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_dev_data:/data

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=local-dev-password
      - POSTGRES_DB=dentix_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dentix_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  frontend_node_modules:
  redis_dev_data:
  postgres_dev_data:
