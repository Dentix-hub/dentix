line-length = 120
target-version = "py311"

[lint]
select = ["E", "F", "W"]
ignore = [
  "E501",  # Line length
  "E711",  # Comparison to None (SQLAlchemy IS NULL)
  "E712",  # Comparison to True/False (SQLAlchemy boolean queries)
  "E402",  # Module level import not at top of file
  "F401",  # Unused imports in __init__.py / re-exports
]
